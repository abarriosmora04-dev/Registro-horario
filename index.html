<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A0B0D">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Registro Horario — ControlPark</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<style>
:root{
  --bg:#0A0B0D;--bg2:#101217;--card:#161A21;--card2:#1C212A;--line:#262C37;
  --txt:#E9EDF3;--mut:#8C95A5;--dim:#5D6676;
  --blue:#4B9EFF;--blue2:#2D7FF9;--coral:#FF6B6B;--green:#38D996;--amber:#FFB547;
  --r:14px;--safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--txt);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;padding-bottom:calc(76px + var(--safe-b))}
a{color:var(--blue)}
button,input,select,textarea{font:inherit;color:inherit}
.hidden{display:none!important}
/* layout */
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top,0px)) 16px 10px;background:rgba(10,11,13,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;letter-spacing:.2px}
.brand .dot{width:26px;height:26px;border-radius:8px;background:linear-gradient(135deg,var(--blue),var(--blue2));display:grid;place-items:center;font-size:13px;font-weight:800;color:#fff}
.top .sp{flex:1}
.pill{font-size:12px;padding:4px 10px;border-radius:99px;border:1px solid var(--line);background:var(--card);color:var(--mut);cursor:pointer}
.pill.on{background:rgba(75,158,255,.14);border-color:rgba(75,158,255,.4);color:var(--blue)}
main{max-width:980px;margin:0 auto;padding:16px}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;justify-content:space-around;background:rgba(16,18,23,.97);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:6px 4px calc(6px + var(--safe-b))}
.nav a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;text-decoration:none;color:var(--dim);font-size:11px;border-radius:10px;position:relative}
.nav a svg{width:22px;height:22px}
.nav a.act{color:var(--blue)}
@media(min-width:900px){.nav{left:50%;right:auto;transform:translateX(-50%);width:620px;border:1px solid var(--line);border-bottom:0;border-radius:16px 16px 0 0}}
.nav .badge{position:absolute;top:2px;right:calc(50% - 20px);background:var(--coral);color:#fff;font-size:10px;min-width:16px;height:16px;border-radius:8px;display:grid;place-items:center;padding:0 4px}
h1{font-size:22px;margin-bottom:4px}
h2{font-size:17px;margin:20px 0 10px}
h3{font-size:15px;margin-bottom:6px}
.sub{color:var(--mut);font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}
.row{display:flex;align-items:center;gap:10px}
.row.wrap{flex-wrap:wrap}
.between{justify-content:space-between}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media(max-width:560px){.grid3{grid-template-columns:1fr 1fr}}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px}
.stat .v{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.stat .l{font-size:12px;color:var(--mut)}
/* forms */
label{display:block;font-size:12px;color:var(--mut);margin:10px 0 4px}
input,select,textarea{width:100%;background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:11px 12px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--blue)}
textarea{min-height:80px;resize:vertical}
input[type=checkbox]{width:auto}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:11px;padding:11px 16px;font-weight:600;cursor:pointer;background:var(--card2);color:var(--txt);border:1px solid var(--line);text-decoration:none}
.btn:disabled{opacity:.5;cursor:default}
.btn.pri{background:var(--blue2);border-color:var(--blue2);color:#fff}
.btn.danger{background:rgba(255,107,107,.12);border-color:rgba(255,107,107,.4);color:var(--coral)}
.btn.ok{background:rgba(56,217,150,.12);border-color:rgba(56,217,150,.4);color:var(--green)}
.btn.sm{padding:7px 11px;font-size:13px;border-radius:9px}
.btn.block{width:100%}
.btn.ghost{background:transparent}
/* fichar */
.clock{text-align:center;padding:18px 0 8px}
.clock .h{font-size:54px;font-weight:200;letter-spacing:1px;font-variant-numeric:tabular-nums}
.clock .d{color:var(--mut);text-transform:capitalize}
.status{display:inline-flex;align-items:center;gap:6px;font-size:13px;padding:5px 12px;border-radius:99px;margin-top:10px;border:1px solid var(--line);background:var(--card)}
.status i{width:8px;height:8px;border-radius:50%;background:var(--dim)}
.status.trabajando i{background:var(--green);box-shadow:0 0 0 4px rgba(56,217,150,.18)}
.status.pausa i{background:var(--amber)}
.worked{text-align:center;margin:8px 0 18px}
.worked .v{font-size:30px;font-weight:600;font-variant-numeric:tabular-nums}
.bigbtns{display:grid;gap:10px;margin-bottom:16px}
.bigbtns.two{grid-template-columns:1fr 1fr}
.fbtn{border:0;border-radius:18px;padding:22px 10px;font-size:18px;font-weight:700;cursor:pointer;color:#fff;display:flex;flex-direction:column;align-items:center;gap:4px}
.fbtn small{font-weight:500;font-size:12px;opacity:.8}
.fbtn.in{background:linear-gradient(135deg,var(--blue),var(--blue2))}
.fbtn.out{background:linear-gradient(135deg,#FF7E7E,var(--coral))}
.fbtn.pause{background:var(--card2);border:1px solid var(--line);color:var(--amber)}
.fbtn.resume{background:var(--card2);border:1px solid var(--line);color:var(--green)}
/* timeline */
.tl{list-style:none}
.tl li{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.tl li:last-child{border:0}
.tl .t{font-variant-numeric:tabular-nums;font-weight:600;width:52px}
.tag{display:inline-block;font-size:11px;padding:2px 8px;border-radius:99px;background:var(--card2);border:1px solid var(--line);color:var(--mut);white-space:nowrap}
.tag.blue{color:var(--blue);border-color:rgba(75,158,255,.35);background:rgba(75,158,255,.08)}
.tag.coral{color:var(--coral);border-color:rgba(255,107,107,.35);background:rgba(255,107,107,.08)}
.tag.green{color:var(--green);border-color:rgba(56,217,150,.35);background:rgba(56,217,150,.08)}
.tag.amber{color:var(--amber);border-color:rgba(255,181,71,.35);background:rgba(255,181,71,.08)}
/* lists */
.list .it{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.list .it:last-child{border:0}
.list .it .grow{flex:1;min-width:0}
.list .it .t1{font-weight:600}
.list .it .t2{font-size:13px;color:var(--mut)}
.clickable{cursor:pointer}
.av{width:36px;height:36px;border-radius:50%;background:var(--card2);border:1px solid var(--line);display:grid;place-items:center;font-size:13px;font-weight:700;color:var(--blue);flex:none}
/* table */
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--mut);font-weight:500;font-size:12px}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
/* days */
.day{border-bottom:1px solid var(--line);padding:11px 0}
.day:last-child{border:0}
.day .hd{display:flex;align-items:center;gap:10px;cursor:pointer}
.day .dn{width:44px;text-align:center;flex:none}
.day .dn b{display:block;font-size:18px}
.day .dn span{font-size:11px;color:var(--mut);text-transform:uppercase}
.day .det{margin:8px 0 0 54px}
/* week grid */
.wk{display:grid;grid-template-columns:120px repeat(7,minmax(86px,1fr));min-width:740px;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.wk>div{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:6px;font-size:12px;min-height:54px}
.wk .h{background:var(--bg2);color:var(--mut);min-height:auto;text-align:center;text-transform:capitalize}
.wk .h.today{color:var(--blue)}
.wk .n{background:var(--bg2);font-weight:600;display:flex;align-items:center}
.wk .c{cursor:pointer}
.wk .c:hover{background:var(--card2)}
.sh{background:rgba(75,158,255,.12);border:1px solid rgba(75,158,255,.3);color:var(--txt);border-radius:7px;padding:3px 5px;margin-bottom:3px;font-variant-numeric:tabular-nums}
.sh small{display:block;color:var(--mut);font-size:10px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ab{background:rgba(255,181,71,.12);border:1px solid rgba(255,181,71,.3);border-radius:7px;padding:3px 5px;color:var(--amber);margin-bottom:3px}
/* modal */
.mbg{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center}
@media(min-width:640px){.mbg{align-items:center}}
.modal{background:var(--card);border:1px solid var(--line);width:100%;max-width:520px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:18px 18px calc(18px + var(--safe-b))}
@media(min-width:640px){.modal{border-radius:18px}}
.modal h2{margin-top:0}
.modal .acts{display:flex;gap:10px;margin-top:18px}
.modal .acts .btn{flex:1}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + var(--safe-b));z-index:60;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
#toast div{background:var(--card2);border:1px solid var(--line);padding:10px 16px;border-radius:12px;font-size:14px;box-shadow:0 8px 30px rgba(0,0,0,.4);max-width:90vw}
#toast div.err{border-color:rgba(255,107,107,.5);color:var(--coral)}
#toast div.ok{border-color:rgba(56,217,150,.5);color:var(--green)}
.center{min-height:80vh;display:flex;align-items:center;justify-content:center;padding:20px}
.auth{width:100%;max-width:380px}
.auth .logo{width:56px;height:56px;border-radius:16px;background:linear-gradient(135deg,var(--blue),var(--blue2));display:grid;place-items:center;font-size:24px;font-weight:800;margin:0 auto 14px;color:#fff}
.empty{text-align:center;color:var(--mut);padding:26px 10px;font-size:14px}
.spin{width:26px;height:26px;border:3px solid var(--line);border-top-color:var(--blue);border-radius:50%;animation:sp 1s linear infinite;margin:40px auto}
@keyframes sp{to{transform:rotate(360deg)}}
.seg{display:flex;background:var(--bg2);border:1px solid var(--line);border-radius:11px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:transparent;padding:8px;border-radius:8px;color:var(--mut);cursor:pointer;font-size:13px}
.seg button.on{background:var(--card2);color:var(--txt)}
.note{font-size:12px;color:var(--mut);background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:10px;margin-top:10px}
.err-box{color:var(--coral);font-size:13px;margin-top:8px;word-break:break-word}
hr{border:0;border-top:1px solid var(--line);margin:14px 0}
/* print */
#print-root{display:none}
@media print{
  @page{size:A4;margin:14mm}
  body{background:#fff!important;color:#000!important;padding:0}
  body>*:not(#print-root){display:none!important}
  #print-root{display:block!important;font:10.5pt/1.35 Arial,Helvetica,sans-serif;color:#000}
  .pr{page-break-after:always}
  .pr:last-child{page-break-after:auto}
  .pr h1{font-size:15pt;margin:0 0 2mm}
  .pr .meta{display:grid;grid-template-columns:1fr 1fr;gap:2mm 8mm;margin:4mm 0;font-size:9.5pt}
  .pr table{width:100%;border-collapse:collapse;font-size:9pt}
  .pr th,.pr td{border:1px solid #999;padding:1.4mm 2mm;color:#000;white-space:normal}
  .pr th{background:#eee}
  .pr .tot td{font-weight:bold;background:#f4f4f4}
  .pr .firmas{display:grid;grid-template-columns:1fr 1fr;gap:10mm;margin-top:8mm}
  .pr .firmas div{border-top:1px solid #000;padding-top:2mm;font-size:9pt;min-height:22mm}
  .pr .legal{font-size:8pt;color:#333;margin-top:6mm}
}
</style>
</head>
<body>
<div id="app"><div class="spin"></div></div>
<div id="toast"></div>
<div id="modal-root"></div>
<div id="print-root"></div>

<script type="module">
import { firebaseConfig } from './firebase-config.js';

const FB = 'https://www.gstatic.com/firebasejs/10.12.2/';
const TZ = 'Europe/Madrid';
const RETENCION_ANIOS = 4;
const TIPOS = { entrada: 'Entrada', pausa_inicio: 'Inicio pausa', pausa_fin: 'Fin pausa', salida: 'Salida' };
const AUSENCIAS = { vacaciones: 'Vacaciones', baja_it: 'Incapacidad temporal', asuntos_propios: 'Asuntos propios', permiso_retribuido: 'Permiso retribuido', permiso_no_retribuido: 'Permiso no retribuido', otro: 'Otro' };
const CONTRATOS = { fijo_discontinuo: 'Fijo discontinuo', temporal: 'Temporal', indefinido: 'Indefinido', tiempo_parcial: 'Tiempo parcial', otro: 'Otro' };

let F = {}; // firebase fns
let app, auth, db;
const S = { user: null, perfil: null, empresa: null, centros: [], usuarios: [], timer: null, pendientes: 0 };

/* ================= utilidades ================= */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const toDate = v => v?.toDate ? v.toDate() : (v instanceof Date ? v : (v ? new Date(v) : null));
const docsOf = snap => snap.docs.map(d => ({ id: d.id, ...d.data() }));
const pad = n => String(n).padStart(2, '0');

const fDia = new Intl.DateTimeFormat('en-CA', { timeZone: TZ, year: 'numeric', month: '2-digit', day: '2-digit' });
const fHora = new Intl.DateTimeFormat('es-ES', { timeZone: TZ, hour: '2-digit', minute: '2-digit', hourCycle: 'h23' });
const fHoraS = new Intl.DateTimeFormat('es-ES', { timeZone: TZ, hour: '2-digit', minute: '2-digit', second: '2-digit', hourCycle: 'h23' });
const fFechaHora = new Intl.DateTimeFormat('es-ES', { timeZone: TZ, day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit', hourCycle: 'h23' });
const fParts = new Intl.DateTimeFormat('en-US', { timeZone: TZ, hourCycle: 'h23', year: 'numeric', month: 'numeric', day: 'numeric', hour: 'numeric', minute: 'numeric', second: 'numeric' });

const diaDe = d => fDia.format(d);
const diaHoy = () => diaDe(new Date());
const hora = d => d ? fHora.format(d) : '—';
const fechaHora = d => d ? fFechaHora.format(d) : '—';
function addDays(dia, n) { const [y, m, d] = dia.split('-').map(Number); return new Date(Date.UTC(y, m - 1, d + n)).toISOString().slice(0, 10); }
function addMonths(mes, n) { const [y, m] = mes.split('-').map(Number); const d = new Date(Date.UTC(y, m - 1 + n, 1)); return d.toISOString().slice(0, 7); }
function diasDelMes(mes) { const [y, m] = mes.split('-').map(Number); const n = new Date(Date.UTC(y, m, 0)).getUTCDate(); return Array.from({ length: n }, (_, i) => `${mes}-${pad(i + 1)}`); }
function lunesDe(dia) { const [y, m, d] = dia.split('-').map(Number); const wd = new Date(Date.UTC(y, m - 1, d)).getUTCDay(); return addDays(dia, -((wd + 6) % 7)); }
const dowCorto = dia => { const [y, m, d] = dia.split('-').map(Number); return ['dom', 'lun', 'mar', 'mié', 'jue', 'vie', 'sáb'][new Date(Date.UTC(y, m - 1, d)).getUTCDay()]; };
const diaCorto = dia => `${dowCorto(dia)} ${+dia.slice(8)}/${+dia.slice(5, 7)}`;
const diaFmt = dia => dia ? `${dia.slice(8)}/${dia.slice(5, 7)}/${dia.slice(0, 4)}` : '—';
const MESES = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];
const mesNombre = mes => `${MESES[+mes.slice(5) - 1]} ${mes.slice(0, 4)}`;
function tzOffsetMin(date) {
  const p = Object.fromEntries(fParts.formatToParts(date).map(x => [x.type, x.value]));
  return (Date.UTC(+p.year, +p.month - 1, +p.day, +p.hour % 24, +p.minute, +p.second) - Math.floor(date.getTime() / 1000) * 1000) / 60000;
}
function madridDate(dia, hhmm) { // fecha+hora local de Madrid -> Date
  const [y, m, d] = dia.split('-').map(Number); const [h, mi] = hhmm.split(':').map(Number);
  const base = Date.UTC(y, m - 1, d, h, mi);
  let t = base - tzOffsetMin(new Date(base)) * 60000;
  const off2 = tzOffsetMin(new Date(t)); t = base - off2 * 60000;
  return new Date(t);
}
function dur(ms) { const m = Math.round((ms || 0) / 60000); const a = Math.abs(m); return `${m < 0 ? '-' : ''}${Math.floor(a / 60)}h ${pad(a % 60)}m`; }
function durClock(ms) { const s = Math.max(0, Math.floor(ms / 1000)); return `${pad(Math.floor(s / 3600))}:${pad(Math.floor(s / 60) % 60)}:${pad(s % 60)}`; }
const horasDec = ms => (Math.round((ms || 0) / 36000) / 100).toFixed(2).replace('.', ',');
const minOf = hhmm => { const [h, m] = hhmm.split(':').map(Number); return h * 60 + m; };
const turnoMin = t => { let d = minOf(t.fin) - minOf(t.inicio); if (d <= 0) d += 1440; return d; };
const iniciales = u => ((u?.nombre || '?')[0] + (u?.apellidos || '')[0] || '').toUpperCase();
const nombreDe = u => u ? `${u.nombre || ''} ${u.apellidos || ''}`.trim() : 'Desconocido';
const userById = id => S.usuarios.find(u => u.id === id) || (S.perfil?.id === id ? S.perfil : null);
const centroById = id => S.centros.find(c => c.id === id);
const esAdmin = () => S.perfil?.rol === 'admin';
const jornadaDefMin = u => Math.round(((u?.jornadaDiariaH ?? S.empresa?.jornadaDiariaH ?? 8)) * 60);
async function sha256(txt) { const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(txt)); return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, '0')).join(''); }
function haversine(a, b) { const R = 6371000, r = x => x * Math.PI / 180; const dLat = r(b.lat - a.lat), dLng = r(b.lng - a.lng); const h = Math.sin(dLat / 2) ** 2 + Math.cos(r(a.lat)) * Math.cos(r(b.lat)) * Math.sin(dLng / 2) ** 2; return 2 * R * Math.asin(Math.sqrt(h)); }
function chunk(arr, n) { const o = []; for (let i = 0; i < arr.length; i += n) o.push(arr.slice(i, i + n)); return o; }

function toast(msg, type = '') { const d = document.createElement('div'); d.className = type; d.textContent = msg; $('#toast').appendChild(d); setTimeout(() => d.remove(), type === 'err' ? 6000 : 3200); }
function errMsg(e) {
  const c = e?.code || '';
  const map = { 'auth/invalid-credential': 'Email o contraseña incorrectos.', 'auth/wrong-password': 'Contraseña incorrecta.', 'auth/user-not-found': 'No existe ese usuario.', 'auth/too-many-requests': 'Demasiados intentos. Espera unos minutos.', 'auth/email-already-in-use': 'Ese email ya está registrado.', 'auth/weak-password': 'La contraseña debe tener al menos 6 caracteres.', 'auth/invalid-email': 'Email no válido.', 'permission-denied': 'Permiso denegado por las reglas de seguridad.', 'unavailable': 'Sin conexión con el servidor.', 'auth/requires-recent-login': 'Vuelve a iniciar sesión para hacer este cambio.', 'auth/network-request-failed': 'Error de red. Revisa la conexión.' };
  return map[c] || e?.message || String(e);
}
const loading = el => { el.innerHTML = '<div class="spin"></div>'; };
function fail(el, e) { console.error('[' + location.hash + ']', e); const m = esc(errMsg(e)).replace(/(https:\/\/\S+)/g, '<a href="$1" target="_blank" rel="noopener">abrir enlace</a>'); el.innerHTML = `<div class="card"><h3>No se pudo cargar</h3><div class="err-box">${m}</div></div>`; }

function modal(html, onMount) {
  const bg = document.createElement('div'); bg.className = 'mbg';
  bg.innerHTML = `<div class="modal">${html}</div>`;
  bg.addEventListener('click', e => { if (e.target === bg) bg.remove(); });
  $('#modal-root').appendChild(bg);
  const m = $('.modal', bg); m.close = () => bg.remove();
  $$('[data-close]', m).forEach(b => b.onclick = m.close);
  onMount && onMount(m);
  return m;
}
function confirmar(titulo, texto, { ok = 'Confirmar', danger = false } = {}) {
  return new Promise(res => {

/* ================= cálculo de jornadas ================= */
// Aplica correcciones aprobadas a los fichajes originales (nunca se modifican los originales).
function eventosEfectivos(fichajes, correcciones) {
  const aprob = correcciones.filter(c => c.estado === 'aprobada').sort((a, b) => (toDate(a.resueltoTs) || 0) - (toDate(b.resueltoTs) || 0));
  let evs = fichajes.map(f => ({ ...f, ts: toDate(f.ts) }));
  for (const c of aprob) if (c.accion === 'anadir') evs.push({ id: 'c_' + c.id, uid: c.uid, tipo: c.tipo, ts: toDate(c.nuevoTs), dia: c.dia, mes: c.mes, anadido: true, correccion: c });
  for (const c of aprob) {
    if (c.accion === 'anular') evs = evs.filter(e => e.id !== c.fichajeId);
    if (c.accion === 'modificar') evs = evs.map(e => e.id === c.fichajeId ? { ...e, original: e.original || e.ts, ts: toDate(c.nuevoTs), modificado: true, correccion: c } : e);
  }
  return evs.filter(e => e.ts).sort((a, b) => a.ts - b.ts);
}
function calcularJornada(dia, eventos) {
  const j = { dia, eventos, tramos: [], pausas: [], incid: [], estado: 'fuera', ini: null, pIni: null, trabajadoMs: 0, pausaMs: 0, ultimo: null };
  for (const e of eventos) {
    j.ultimo = e.ts;
    if (e.tipo === 'entrada') { if (j.estado !== 'fuera') j.incid.push('Entrada sin salida previa'); j.estado = 'trabajando'; j.ini = e.ts; }
    else if (e.tipo === 'pausa_inicio') { if (j.estado !== 'trabajando') { j.incid.push('Pausa sin estar trabajando'); continue; } j.tramos.push([j.ini, e.ts]); j.pIni = e.ts; j.estado = 'pausa'; }
    else if (e.tipo === 'pausa_fin') { if (j.estado !== 'pausa') { j.incid.push('Fin de pausa sin pausa'); continue; } j.pausas.push([j.pIni, e.ts]); j.ini = e.ts; j.estado = 'trabajando'; }
    else if (e.tipo === 'salida') {
      if (j.estado === 'trabajando') j.tramos.push([j.ini, e.ts]);
      else if (j.estado === 'pausa') j.pausas.push([j.pIni, e.ts]);
      else j.incid.push('Salida sin entrada');
      j.estado = 'fuera';
    }
  }
  j.trabajadoMs = j.tramos.reduce((s, [a, b]) => s + (b - a), 0);
  j.pausaMs = j.pausas.reduce((s, [a, b]) => s + (b - a), 0);
  const entradas = eventos.filter(e => e.tipo === 'entrada'), salidas = eventos.filter(e => e.tipo === 'salida');
  j.primeraEntrada = entradas[0]?.ts || null; j.ultimaSalida = salidas.at(-1)?.ts || null;
  j.corregido = eventos.some(e => e.anadido || e.modificado);
  const abierta = j.estado !== 'fuera';
  if (abierta && dia < addDays(diaHoy(), -1)) j.incid.push('Falta fichaje de salida');
  else if (abierta && dia === addDays(diaHoy(), -1) && Date.now() - j.ultimo > 18 * 3600e3) j.incid.push('Falta fichaje de salida');
  return j;
}
const vivoMs = j => !j ? 0 : j.trabajadoMs + (j.estado === 'trabajando' ? Date.now() - j.ini : 0);
const pausaVivaMs = j => !j ? 0 : j.pausaMs + (j.estado === 'pausa' ? Date.now() - j.pIni : 0);
function jornadasPorDia(eventos) {
  const g = new Map(); for (const e of eventos) { if (!g.has(e.dia)) g.set(e.dia, []); g.get(e.dia).push(e); }
  const out = new Map(); for (const [d, evs] of g) out.set(d, calcularJornada(d, evs)); return out;
}
function groupBy(arr, k) { const m = new Map(); for (const x of arr) { const v = x[k]; if (!m.has(v)) m.set(v, []); m.get(v).push(x); } return m; }
function estadoActual(jornadas) {
  const hoy = diaHoy(), ayer = addDays(hoy, -1);
  const jA = jornadas.get(ayer), jH = jornadas.get(hoy);
  if (jH && jH.estado !== 'fuera') return { dia: hoy, j: jH };
  if (jA && jA.estado !== 'fuera' && Date.now() - jA.ultimo < 18 * 3600e3) return { dia: ayer, j: jA };
  return { dia: hoy, j: jH || null };
}
function ausenciaEn(ausencias, uid, dia) { return ausencias.find(a => a.uid === uid && a.estado === 'aprobada' && a.desde <= dia && a.hasta >= dia); }
// resumen de un mes para un empleado
function resumenMes(usuario, mes, jornadas, turnos, ausencias = []) {
  const tpd = groupBy(turnos.filter(t => t.uid === usuario.id), 'fecha');
  const filas = []; let tot = 0, extra = 0, prev = 0, dias = 0, incid = 0;
  for (const dia of diasDelMes(mes)) {
    const j = jornadas.get(dia); const ts = tpd.get(dia) || []; const aus = ausenciaEn(ausencias, usuario.id, dia);
    const prevista = ts.length ? ts.reduce((s, t) => s + turnoMin(t), 0) : null;
    const trab = j ? j.trabajadoMs : 0;
    let ex = 0;
    if (j && j.estado === 'fuera' && trab > 0) { const ref = prevista ?? jornadaDefMin(usuario); ex = Math.max(0, trab - ref * 60000); }
    if (j || ts.length || aus) filas.push({ dia, j, turnos: ts, prevista, trab, extra: ex, aus });
    if (j) { tot += trab; extra += ex; if (trab > 0) dias++; incid += j.incid.length; }
    if (prevista) prev += prevista * 60000;
  }
  return { filas, tot, extra, prev, dias, incid };
}

const col = n => F.collection(db, n);
async function q(n, ...conds) { return docsOf(await F.getDocs(F.query(col(n), ...conds))); }
async function qIn(n, field, values, ...conds) { // 'in' admite 30 valores
  const res = await Promise.all(chunk(values, 30).map(v => q(n, F.where(field, 'in', v), ...conds)));
  return res.flat();
}
async function cargarCentros() { S.centros = (await q('centros')).sort((a, b) => a.nombre.localeCompare(b.nombre)); }
async function cargarUsuarios() { S.usuarios = (await q('usuarios')).sort((a, b) => nombreDe(a).localeCompare(nombreDe(b))); }
async function cargarMesUsuario(uid, mes) {
  const [fs, cs, ts, cis, aus] = await Promise.all([
    q('fichajes', F.where('uid', '==', uid), F.where('mes', '==', mes)),
    q('correcciones', F.where('uid', '==', uid), F.where('mes', '==', mes)),
    q('turnos', F.where('uid', '==', uid), F.where('mes', '==', mes)),
    q('cierres', F.where('uid', '==', uid), F.where('mes', '==', mes)),
    q('ausencias', F.where('uid', '==', uid)),
  ]);
  const evs = eventosEfectivos(fs, cs);
  return { fichajes: fs, correcciones: cs, eventos: evs, jornadas: jornadasPorDia(evs), turnos: ts, cierres: cis.sort((a, b) => (toDate(b.creadoTs) || 0) - (toDate(a.creadoTs) || 0)), ausencias: aus };
}

async function start() {
  const [fa, fau, ffs] = await Promise.all([import(FB + 'firebase-app.js'), import(FB + 'firebase-auth.js'), import(FB + 'firebase-firestore.js')]);
  F = { ...fa, ...fau, ...ffs };
  app = F.initializeApp(firebaseConfig);
  auth = F.getAuth(app);
  db = F.getFirestore(app);
  if (firebaseConfig.emulador && location.hostname === 'localhost') { // solo para pruebas locales
    F.connectAuthEmulator(auth, 'http://127.0.0.1:9099', { disableWarnings: true });
    F.connectFirestoreEmulator(db, '127.0.0.1', 8085);
  }
  window.addEventListener('hashchange', route);
  F.onAuthStateChanged(auth, async u => {
    clearInterval(S.timer);
    if (!u) {
      S.user = S.perfil = null;
      const emp = await F.getDoc(F.doc(db, 'config', 'empresa'));
      S.empresa = emp.exists() ? emp.data() : null;
      return S.empresa ? renderLogin() : renderSetup();
    }
    try {
      S.user = u;
      const p = await F.getDoc(F.doc(db, 'usuarios', u.uid));
      if (!p.exists() || !p.data().activo) { S.aviso = 'Tu usuario no está dado de alta o está de baja. Contacta con el administrador.'; await F.signOut(auth); return; }
      S.perfil = { id: u.uid, ...p.data() };
      S.empresa = (await F.getDoc(F.doc(db, 'config', 'empresa'))).data() || {};
      await cargarCentros();
      if (esAdmin()) await cargarUsuarios(); else S.usuarios = [S.perfil];
      if (!sessionStorage.getItem('cp_login_' + u.uid)) { sessionStorage.setItem('cp_login_' + u.uid, '1'); audit('acceso', 'Inicio de sesión'); }
      if (!location.hash || location.hash === '#/') location.hash = esAdmin() && matchMedia('(min-width:900px)').matches ? '#/admin/panel' : '#/fichar';
      else route();
      contarPendientes();
    } catch (e) { fail($('#app'), e); }
  });
}

    ${aus ? `<div class="card" style="border-color:rgba(255,181,71,.4)"><span class="tag amber">${esc(AUSENCIAS[aus.tipo] || aus.tipo)}</span> <span class="sub">Tienes una ausencia aprobada hoy.</span></div>` : ''}
    ${btns}
    <div class="card"><h3>Tu turno de hoy</h3>${turnosTxt}</div>
    <div class="card"><h3>Fichajes ${dia === hoy ? 'de hoy' : 'de la jornada'}</h3>
    ${evs.length ? `<ul class="tl">${evs.map(e => `<li><span class="t">${hora(e.ts)}</span><span>${TIPOS[e.tipo]}</span><span style="flex:1"></span>${e.anadido || e.modificado ? '<span class="tag amber">corregido</span>' : ''}${e.fueraRadio ? '<span class="tag coral">fuera de zona</span>' : ''}</li>`).join('')}</ul>` : '<span class="sub">Aún no has fichado.</span>'}
    <p style="margin-top:10px"><a href="#/historial" style="font-size:13px">¿Te olvidaste de fichar? Solicita una corrección →</a></p></div>`;
  $$('[data-f]', el).forEach(b => b.onclick = () => fichar(b.dataset.f, dia, ts[0]));
  S.timer = setInterval(() => {
    const c = $('#clk'); if (!c) return clearInterval(S.timer);
    c.textContent = fHoraS.format(new Date()); $('#wk').textContent = durClock(vivoMs(j));
    const pz = $('#pz'); if (pz) pz.textContent = dur(pausaVivaMs(j));
  }, 1000);
};

function obtenerUbicacion() {
  return new Promise(res => {
    if (!navigator.geolocation) return res({ error: 'no_soportado' });
    navigator.geolocation.getCurrentPosition(
      p => res({ lat: +p.coords.latitude.toFixed(6), lng: +p.coords.longitude.toFixed(6), precision: Math.round(p.coords.accuracy) }),
      e => res({ error: e.code === 1 ? 'denegado' : 'no_disponible' }),
      { enableHighAccuracy: true, timeout: 12000, maximumAge: 20000 });
  });
}

async function avisoGeo() {
  if (S.perfil.geoAceptadoTs) return true;
  const e = S.empresa;
  const ok = await new Promise(res => {
    const m = modal(`<h2>Información sobre ubicación</h2>
      <p class="sub" style="margin-bottom:8px">Antes de tu primer fichaje te informamos (art. 13 RGPD y art. 90 LOPDGDD):</p>
      <ul style="padding-left:18px;font-size:14px;line-height:1.6">
      <li><b>Responsable:</b> ${esc(e.nombre)} (${esc(e.cif)}).</li>
      <li><b>Qué se recoge:</b> tu ubicación <b>solo en el instante de fichar</b>. No hay seguimiento continuo.</li>
      <li><b>Finalidad:</b> verificar el lugar de inicio y fin de jornada (registro de jornada, art. 34.9 ET).</li>
      <li><b>Base jurídica:</b> cumplimiento de obligación legal y ejecución del contrato laboral.</li>
      <li><b>Conservación:</b> ${RETENCION_ANIOS} años, igual que el registro de jornada.</li>
      <li><b>Derechos:</b> acceso, rectificación, supresión, oposición y limitación en ${esc(e.emailEmpresa || 'la empresa')}. Puedes reclamar ante la AEPD.</li></ul>
      <div class="acts"><button class="btn" data-no>Ahora no</button><button class="btn pri" data-yes>He sido informado</button></div>`);
    $('[data-no]', m).onclick = () => { m.close(); res(false); };
    $('[data-yes]', m).onclick = () => { m.close(); res(true); };
  });
  if (!ok) return false;
  await F.updateDoc(F.doc(db, 'usuarios', S.user.uid), { geoAceptadoTs: F.serverTimestamp() });
  S.perfil.geoAceptadoTs = new Date(); audit('privacidad', 'Acepta información sobre geolocalización');
  return true;
}

async function fichar(tipo, diaJornada, turno) {
  if (!navigator.onLine) return toast('Sin conexión. Conéctate para fichar: la hora la pone el servidor.', 'err');
  const modo = S.empresa.geoModo || 'registrar';
  if (modo !== 'off' && !(await avisoGeo())) { if (modo === 'obligatoria') return toast('Debes aceptar la información de ubicación para fichar.', 'err'); }
  const m = modal(`<h2>${TIPOS[tipo]}</h2><div class="spin"></div><p class="sub" style="text-align:center">${modo !== 'off' ? 'Obteniendo ubicación…' : 'Registrando…'}</p>`);
  try {
    let geo = null, geoError = null, distanciaM = null, fueraRadio = false;
    if (modo !== 'off' && S.perfil.geoAceptadoTs) {
      const r = await obtenerUbicacion();
      if (r.error) { geoError = r.error; if (modo === 'obligatoria') { m.close(); return toast('No se pudo obtener tu ubicación. Activa la localización para fichar.', 'err'); } }
      else geo = r;
    }
    const centroId = turno?.centroId || S.perfil.centroId || null;
    const c = centroById(centroId);
    if (geo && c?.lat != null && c?.lng != null) {
      distanciaM = Math.round(haversine(geo, { lat: +c.lat, lng: +c.lng }));
      fueraRadio = distanciaM > (+c.radioM || S.empresa.radioDefectoM || 300) + Math.min(geo.precision || 0, 200);
    }
    await F.addDoc(col('fichajes'), {
      uid: S.user.uid, tipo, ts: F.serverTimestamp(), tsCliente: Date.now(), dia: diaJornada, mes: diaJornada.slice(0, 7),
      centroId, geo, geoError, distanciaM, fueraRadio, dispositivo: navigator.userAgent.slice(0, 160),
    });
    audit('fichaje', `${TIPOS[tipo]}${fueraRadio ? ` (fuera de zona, ${distanciaM} m)` : ''}`);
    m.close(); toast(`${TIPOS[tipo]} registrada a las ${hora(new Date())}`, 'ok');
    if (navigator.vibrate) navigator.vibrate(60);
    route();
  } catch (e) { m.close(); toast(errMsg(e), 'err'); }
}

RUTAS['horario'] = async el => {
  const uid = S.user.uid, hoy = diaHoy(), mes = hoy.slice(0, 7);
  const [ts, aus] = await Promise.all([
    q('turnos', F.where('uid', '==', uid), F.where('mes', 'in', [mes, addMonths(mes, 1)])),
    q('ausencias', F.where('uid', '==', uid)),
  ]);
  const ini = lunesDe(hoy); const dias = Array.from({ length: 28 }, (_, i) => addDays(ini, i));
  const tpd = groupBy(ts, 'fecha');
  let html = `<h1>Mi horario</h1><p class="sub">Turnos asignados para las próximas 4 semanas.</p>`;
  for (let w = 0; w < 4; w++) {
    const sem = dias.slice(w * 7, w * 7 + 7);
    const minSem = sem.reduce((s, d) => s + (tpd.get(d) || []).reduce((a, t) => a + turnoMin(t), 0), 0);
    html += `<h2>Semana del ${diaFmt(sem[0]).slice(0, 5)} <span class="sub">· ${dur(minSem * 60000)} previstas</span></h2><div class="card list">`;
    html += sem.map(d => {
      const t = (tpd.get(d) || []).sort((a, b) => a.inicio.localeCompare(b.inicio)); const a = ausenciaEn(aus, uid, d);
      return `<div class="it" style="${d === hoy ? 'background:rgba(75,158,255,.06);margin:0 -14px;padding:12px 14px' : ''}"><div class="dn" style="width:46px;text-align:center"><b style="display:block;font-size:18px">${+d.slice(8)}</b><span class="sub" style="font-size:11px;text-transform:uppercase">${dowCorto(d)}</span></div>
      <div class="grow">${a ? `<span class="tag amber">${esc(AUSENCIAS[a.tipo])}</span>` : ''}${t.length ? t.map(x => `<div class="t1">${x.inicio} – ${x.fin} <span class="sub" style="font-weight:400">${esc(centroById(x.centroId)?.nombre || '')}${x.notas ? ' · ' + esc(x.notas) : ''}</span></div>`).join('') : (a ? '' : '<span class="sub">Libre</span>')}</div></div>`;
    }).join('') + '</div>';
  }
  el.innerHTML = html;
};

function htmlDias(usuario, res, { admin = false } = {}) {
  if (!res.filas.length) return '<div class="empty">No hay registros este mes.</div>';
  return res.filas.slice().reverse().map(f => {
    const j = f.j; const tramos = j ? j.tramos.map(([a, b]) => `${hora(a)}–${hora(b)}`).join(', ') : '';
    const abierto = j && j.estado !== 'fuera' ? `${hora(j.ini || j.pIni)}–…` : '';
    return `<div class="day" data-dia="${f.dia}"><div class="hd">
      <div class="dn"><b>${+f.dia.slice(8)}</b><span>${dowCorto(f.dia)}</span></div>
      <div style="flex:1;min-width:0"><div style="font-variant-numeric:tabular-nums">${tramos || abierto ? esc([tramos, abierto].filter(Boolean).join(', ')) : (f.aus ? '' : '<span class="sub">Sin fichajes</span>')}</div>
      <div class="row wrap" style="gap:5px;margin-top:3px">${f.turnos.map(t => `<span class="tag">Turno ${t.inicio}–${t.fin}</span>`).join('')}${f.aus ? `<span class="tag amber">${esc(AUSENCIAS[f.aus.tipo])}</span>` : ''}${j?.corregido ? '<span class="tag amber">corregido</span>' : ''}${(j?.incid || []).map(i => `<span class="tag coral">${esc(i)}</span>`).join('')}${j?.eventos.some(e => e.fueraRadio) ? '<span class="tag coral">fuera de zona</span>' : ''}</div></div>
      <div style="text-align:right"><b style="font-variant-numeric:tabular-nums">${j ? dur(j.trabajadoMs) : ''}</b>${f.extra ? `<div class="tag blue">+${dur(f.extra)}</div>` : ''}</div></div>
      <div class="det hidden">${j ? `<ul class="tl">${j.eventos.map(e => `<li><span class="t">${hora(e.ts)}</span><span>${TIPOS[e.tipo]}</span><span style="flex:1"></span>
        ${e.modificado ? `<span class="tag amber" title="${esc(e.correccion?.motivo)}">antes ${hora(e.original)}</span>` : ''}${e.anadido ? `<span class="tag amber" title="${esc(e.correccion?.motivo)}">añadido</span>` : ''}
        ${admin && e.geo ? `<a class="tag" href="https://maps.google.com/?q=${e.geo.lat},${e.geo.lng}" target="_blank" rel="noopener">${e.distanciaM != null ? e.distanciaM + ' m' : 'mapa'}</a>` : ''}${admin && e.geoError ? `<span class="tag">sin ubicación</span>` : ''}</li>`).join('')}</ul>
        ${j.pausaMs ? `<p class="sub">Pausas: ${dur(j.pausaMs)}</p>` : ''}` : ''}
        <button class="btn sm" style="margin-top:8px" data-corr="${f.dia}">${admin ? 'Corregir' : 'Solicitar corrección'}</button></div></div>`;
  }).join('');
}
function bindDias(root, usuario, datos, onDone, admin) {
  $$('.day .hd', root).forEach(h => h.onclick = () => $('.det', h.parentElement).classList.toggle('hidden'));
  $$('[data-corr]', root).forEach(b => b.onclick = () => modalCorreccion(usuario, b.dataset.corr, datos.jornadas.get(b.dataset.corr), admin, onDone));
}

function modalCorreccion(usuario, dia, jornada, admin, onDone) {
  const evs = (jornada?.eventos || []);
  const m = modal(`<h2>${admin ? 'Corregir registro' : 'Solicitar corrección'}</h2>
    <p class="sub">${esc(nombreDe(usuario))} · jornada del ${diaFmt(dia)}</p>
    <label>¿Qué quieres hacer?</label>
    <div class="seg" id="c-acc"><button type="button" data-v="anadir" class="on">Añadir fichaje</button><button type="button" data-v="modificar" ${evs.length ? '' : 'disabled'}>Cambiar hora</button><button type="button" data-v="anular" ${evs.length ? '' : 'disabled'}>Anular</button></div>
    <div id="c-sel" class="hidden"><label>Fichaje</label><select id="c-fid">${evs.map(e => `<option value="${e.id}" data-ts="${e.ts.getTime()}">${hora(e.ts)} · ${TIPOS[e.tipo]}</option>`).join('')}</select></div>
    <div id="c-tipo"><label>Tipo</label><select id="c-t">${Object.entries(TIPOS).map(([k, v]) => `<option value="${k}">${v}</option>`).join('')}</select></div>
    <div id="c-when" class="grid2"><div><label>Fecha</label><input type="date" id="c-d" value="${dia}"></div><div><label>Hora</label><input type="time" id="c-h" required></div></div>
    <label>Motivo (obligatorio)</label><textarea id="c-mot" placeholder="Ej.: olvidé fichar la salida al terminar el turno"></textarea>
    ${admin ? '<p class="note">La corrección se aplica al momento y queda registrada con tu nombre, fecha y motivo. El fichaje original no se borra.</p>' : '<p class="note">El administrador revisará la solicitud. El fichaje original se conserva siempre.</p>'}
    <div class="err-box" id="c-err"></div>
    <div class="acts"><button class="btn" data-close>Cancelar</button><button class="btn pri" id="c-ok">${admin ? 'Aplicar' : 'Enviar'}</button></div>`);
  let acc = 'anadir';
  const upd = () => {
    $$('#c-acc button', m).forEach(b => b.classList.toggle('on', b.dataset.v === acc));
    $('#c-sel', m).classList.toggle('hidden', acc === 'anadir'); $('#c-tipo', m).classList.toggle('hidden', acc !== 'anadir'); $('#c-when', m).classList.toggle('hidden', acc === 'anular');
    if (acc === 'modificar') { const o = $('#c-fid', m).selectedOptions[0]; if (o) { const d = new Date(+o.dataset.ts); $('#c-d', m).value = diaDe(d); $('#c-h', m).value = hora(d); } }
  };
  $$('#c-acc button', m).forEach(b => b.onclick = () => { if (!b.disabled) { acc = b.dataset.v; upd(); } });
  $('#c-fid', m).onchange = upd;
  $('#c-ok', m).onclick = async () => {
    const mot = $('#c-mot', m).value.trim(); const err = $('#c-err', m);
    if (mot.length < 5) return err.textContent = 'Explica el motivo (mínimo 5 caracteres).';
    const data = { uid: usuario.id, dia, mes: dia.slice(0, 7), accion: acc, motivo: mot, autorUid: S.user.uid, creadoTs: F.serverTimestamp() };
    if (acc !== 'anular') {
      const d = $('#c-d', m).value, h = $('#c-h', m).value; if (!d || !h) return err.textContent = 'Indica fecha y hora.';
      const nt = madridDate(d, h); if (nt > new Date()) return err.textContent = 'No se puede registrar una hora futura.';
      data.nuevoTs = F.Timestamp.fromDate(nt);
    }
    if (acc === 'anadir') data.tipo = $('#c-t', m).value;
    else { const ev = evs.find(e => e.id === $('#c-fid', m).value); data.fichajeId = ev.id; data.tipo = ev.tipo; data.valorAnterior = F.Timestamp.fromDate(ev.ts); }
    if (admin) Object.assign(data, { estado: 'aprobada', resueltoPor: S.user.uid, resueltoTs: F.serverTimestamp(), respuesta: 'Corrección directa del administrador' });
    else data.estado = 'pendiente';
    try {
      await F.addDoc(col('correcciones'), data);
      audit(admin ? 'correccion_aplicada' : 'correccion_solicitada', `${nombreDe(usuario)} · ${diaFmt(dia)} · ${acc} ${TIPOS[data.tipo] || ''}${data.nuevoTs ? ' ' + fechaHora(data.nuevoTs.toDate()) : ''} · ${mot}`, { uidAfectado: usuario.id });
      m.close(); toast(admin ? 'Corrección aplicada' : 'Solicitud enviada', 'ok'); onDone && onDone();
    } catch (e) { err.textContent = errMsg(e); }
  };
}

/* ================= ADMIN: panel ================= */
RUTAS['admin/panel'] = async el => {
  await cargarUsuarios();
  const hoy = diaHoy(); const dias7 = Array.from({ length: 8 }, (_, i) => addDays(hoy, -i));
  const [fs, cs, ts, aus] = await Promise.all([qIn('fichajes', 'dia', dias7), qIn('correcciones', 'dia', dias7), q('turnos', F.where('fecha', '==', hoy)), q('ausencias', F.where('estado', '==', 'aprobada'))]);
  const evPorU = groupBy(eventosEfectivos(fs, cs), 'uid');
  const activos = S.usuarios.filter(u => u.activo);
  const tpu = groupBy(ts, 'uid');
  const grupos = { trabajando: [], pausa: [], terminado: [], sinFichar: [], ausentes: [] };
  const incid = [];
  for (const u of activos) {
    const jor = jornadasPorDia(evPorU.get(u.id) || []);
    const { j } = estadoActual(jor);
    const a = ausenciaEn(aus, u.id, hoy);
    for (const [d, jj] of jor) if (jj.incid.length && d !== hoy) incid.push({ u, d, jj });
    const t = tpu.get(u.id);
    if (j?.estado === 'trabajando') grupos.trabajando.push({ u, j, t });
    else if (j?.estado === 'pausa') grupos.pausa.push({ u, j, t });
    else if (a) grupos.ausentes.push({ u, a });
    else if (j && j.dia === hoy && j.eventos.length) grupos.terminado.push({ u, j, t });
    else if (t) grupos.sinFichar.push({ u, t });
  }
  const linea = ({ u, j, t, a }, extra = '') => `<div class="it clickable" data-u="${u.id}"><div class="av">${esc(iniciales(u))}</div><div class="grow"><div class="t1">${esc(nombreDe(u))}</div><div class="t2">${t ? t.map(x => `${x.inicio}–${x.fin} ${esc(centroById(x.centroId)?.nombre || '')}`).join(', ') : esc(centroById(u.centroId)?.nombre || '')}${a ? esc(AUSENCIAS[a.tipo]) : ''}</div></div>${extra}</div>`;
  const tardeMin = x => { if (!x.t) return 0; const ini = madridDate(hoy, x.t.map(t => t.inicio).sort()[0]); return Math.round((Date.now() - ini) / 60000); };
  el.innerHTML = `<h1>Ahora mismo</h1><p class="sub" style="text-transform:capitalize">${new Intl.DateTimeFormat('es-ES', { timeZone: TZ, dateStyle: 'full' }).format(new Date())}</p>
    <div class="grid3" style="margin:14px 0"><div class="stat"><div class="v" style="color:var(--green)">${grupos.trabajando.length}</div><div class="l">Trabajando</div></div><div class="stat"><div class="v" style="color:var(--amber)">${grupos.pausa.length}</div><div class="l">En pausa</div></div><div class="stat"><div class="v" style="color:var(--coral)">${grupos.sinFichar.filter(x => tardeMin(x) > 0).length}</div><div class="l">Turno sin fichar</div></div></div>
    ${S.pendientes ? `<a href="#/admin/solicitudes" class="card row between" style="text-decoration:none;color:inherit;border-color:rgba(75,158,255,.4)"><span>Tienes <b>${S.pendientes}</b> solicitud(es) pendiente(s)</span><span>→</span></a>` : ''}
    ${incid.length ? `<h2>Incidencias recientes</h2><div class="card list">${incid.map(x => `<div class="it clickable" data-u="${x.u.id}" data-mes="${x.d.slice(0, 7)}"><div class="av">${esc(iniciales(x.u))}</div><div class="grow"><div class="t1">${esc(nombreDe(x.u))}</div><div class="t2">${diaCorto(x.d)} · ${x.jj.incid.map(esc).join(', ')}</div></div><span class="tag coral">revisar</span></div>`).join('')}</div>` : ''}
    <h2>Trabajando</h2><div class="card list">${grupos.trabajando.map(x => linea(x, `<span class="tag green">desde ${hora(x.j.primeraEntrada)}</span>`)).join('') || '<div class="empty">Nadie</div>'}</div>
    ${grupos.pausa.length ? `<h2>En pausa</h2><div class="card list">${grupos.pausa.map(x => linea(x, `<span class="tag amber">desde ${hora(x.j.pIni)}</span>`)).join('')}</div>` : ''}
    <h2>Con turno hoy sin fichar</h2><div class="card list">${grupos.sinFichar.map(x => { const tm = tardeMin(x); return linea(x, tm > 0 ? `<span class="tag coral">${tm < 120 ? tm + ' min tarde' : 'no ha entrado'}</span>` : '<span class="tag">aún no empieza</span>'); }).join('') || '<div class="empty">Nadie</div>'}</div>
    ${grupos.terminado.length ? `<h2>Jornada terminada</h2><div class="card list">${grupos.terminado.map(x => linea(x, `<span class="tag">${dur(x.j.trabajadoMs)}</span>`)).join('')}</div>` : ''}
    ${grupos.ausentes.length ? `<h2>Ausentes</h2><div class="card list">${grupos.ausentes.map(x => linea(x)).join('')}</div>` : ''}`;
  $$('[data-u]', el).forEach(i => i.onclick = () => { regSel.uid = i.dataset.u; if (i.dataset.mes) mesSel = i.dataset.mes; location.hash = '#/admin/registros'; });
};

function modalTurno(u, dia, existentes, semana) {

  };
}

async function crearCierre(u, mes, res, eventos) {
  if (res.incid) { if (!(await confirmar('Hay incidencias', `Este mes tiene ${res.incid} incidencia(s) sin resolver. ¿Cerrar igualmente?`))) return; }
  const m = modal(`<h2>Cerrar ${mesNombre(mes)}</h2><p class="sub">${esc(nombreDe(u))}</p>
    <div class="grid2" style="margin:12px 0"><div class="stat"><div class="v">${dur(res.tot)}</div><div class="l">Trabajadas</div></div><div class="stat"><div class="v">${dur(res.extra)}</div><div class="l">Extra</div></div></div>
    <label>Compensación de horas extraordinarias</label><select id="cc"><option value="ninguna">Sin horas extra / no aplica</option><option value="pago">Retribuidas</option><option value="descanso">Compensadas con descanso</option></select>
    <p class="note">Se guarda una huella SHA-256 del registro del mes. El empleado podrá revisarlo y firmarlo desde su móvil (art. 35.5 ET: totalización mensual de horas extra con copia al trabajador).</p>
    <div class="acts"><button class="btn" data-close>Cancelar</button><button class="btn pri" id="cok">Cerrar mes</button></div>`);
  $('#cc', m).value = res.extra ? 'pago' : 'ninguna';
  $('#cok', m).onclick = async () => {
    const canon = JSON.stringify(eventos.map(e => [e.id, e.tipo, e.ts.toISOString(), e.dia]));
    const huella = await sha256(`${u.id}|${mes}|${canon}`);
    try {
      await F.addDoc(col('cierres'), { uid: u.id, mes, trabajadoMs: res.tot, extraMs: res.extra, previstoMs: res.prev, dias: res.dias, compensacion: $('#cc', m).value, huella, nEventos: eventos.length, creadoPor: S.user.uid, creadoTs: F.serverTimestamp() });
      audit('cierre_mes', `${nombreDe(u)} · ${mesNombre(mes)} · ${dur(res.tot)} (+${dur(res.extra)})`, { uidAfectado: u.id });
      m.close(); toast('Mes cerrado. Pendiente de firma del empleado.', 'ok'); route();
    } catch (e) { toast(errMsg(e), 'err'); }
  };
}

    const hasta = d => { const x = new Date(d); x.setFullYear(x.getFullYear() + RETENCION_ANIOS); return diaFmt(diaDe(x)); };
    fs.slice().sort((a, b) => toDate(a.ts) - toDate(b.ts)).forEach(f => { const u = userById(f.uid); rows.push(['Fichaje', f.id, nombreDe(u), u?.dni, diaFmt(f.dia), TIPOS[f.tipo], fechaHora(toDate(f.ts)), '', '', centroById(f.centroId)?.nombre || '', f.geo?.lat ?? '', f.geo?.lng ?? '', f.geo?.precision ?? '', f.distanciaM ?? '', f.fueraRadio ? 'Sí' : '', 'Original', '', nombreDe(u), '', '', hasta(toDate(f.ts))]); });
    cs.slice().sort((a, b) => toDate(a.creadoTs) - toDate(b.creadoTs)).forEach(c => { const u = userById(c.uid); rows.push(['Corrección', c.id, nombreDe(u), u?.dni, diaFmt(c.dia), `${c.accion} ${TIPOS[c.tipo] || ''}`, fechaHora(toDate(c.creadoTs)), c.nuevoTs ? fechaHora(toDate(c.nuevoTs)) : '', c.valorAnterior ? fechaHora(toDate(c.valorAnterior)) : '', '', '', '', '', '', '', c.estado, c.motivo, nombreDe(userById(c.autorUid)), c.resueltoPor ? nombreDe(userById(c.resueltoPor)) : '', c.resueltoTs ? fechaHora(toDate(c.resueltoTs)) : '', hasta(toDate(c.creadoTs))]); });
    descargar(`registro_jornada_${mesSel}_inspeccion.csv`, csv(rows)); audit('exportacion', `CSV registros originales ${mesSel}`);
  };
};

function imprimir(lista) {
  if (!lista.length) return toast('No hay datos para imprimir');
  const e = S.empresa;
  const hastaConserv = mes => { const [y, m] = mes.split('-').map(Number); return `${new Date(Date.UTC(y, m, 0)).getUTCDate()}/${pad(m)}/${y + RETENCION_ANIOS}`; };
  $('#print-root').innerHTML = lista.map(({ usuario: u, mes, res, cierre }) => `<section class="pr">
    <h1>Registro diario de jornada — ${mesNombre(mes)}</h1>
    <div class="meta"><div><b>Empresa:</b> ${esc(e.nombre)}<br><b>CIF:</b> ${esc(e.cif)}<br><b>Domicilio:</b> ${esc(e.direccion || '')}</div>
    <div><b>Trabajador/a:</b> ${esc(nombreDe(u))}<br><b>DNI/NIE:</b> ${esc(u.dni || '')}<br><b>Centro habitual:</b> ${esc(centroById(u.centroId)?.nombre || '—')} · <b>Contrato:</b> ${esc(CONTRATOS[u.contrato] || '')}</div></div>
    <table><thead><tr><th>Fecha</th><th>Turno previsto</th><th>Entrada / salida (tramos)</th><th>Pausas</th><th>Horas</th><th>Extra</th><th>Observaciones</th></tr></thead><tbody>
    ${res.filas.map(r => `<tr><td>${diaCorto(r.dia)}</td><td>${r.turnos.map(t => `${t.inicio}–${t.fin}`).join(', ')}</td><td>${r.j ? r.j.tramos.map(([a, b]) => `${hora(a)}–${hora(b)}`).join(', ') : ''}</td><td>${r.j?.pausaMs ? dur(r.j.pausaMs) : ''}</td><td>${r.j ? dur(r.trab) : ''}</td><td>${r.extra ? dur(r.extra) : ''}</td><td>${[r.aus ? AUSENCIAS[r.aus.tipo] : '', r.j?.corregido ? 'Corregido (ver trazabilidad)' : '', ...(r.j?.incid || [])].filter(Boolean).join('; ')}</td></tr>`).join('')}
    <tr class="tot"><td colspan="4">Totales del mes (${res.dias} días trabajados)</td><td>${dur(res.tot)}</td><td>${dur(res.extra)}</td><td>Previstas: ${dur(res.prev)}</td></tr></tbody></table>
    ${cierre ? `<p style="margin-top:3mm;font-size:9pt"><b>Cierre mensual:</b> ${fechaHora(toDate(cierre.creadoTs))}. Horas extra: ${dur(cierre.extraMs)} (${{ pago: 'retribuidas', descanso: 'compensadas con descanso', ninguna: 'no aplica' }[cierre.compensacion]}). ${cierre.firmadoTs ? `Firmado electrónicamente por el trabajador el ${fechaHora(toDate(cierre.firmadoTs))}: ${cierre.firmaConforme ? 'CONFORME' : 'NO CONFORME'}${cierre.firmaComentario ? ' — ' + esc(cierre.firmaComentario) : ''}.` : 'Pendiente de firma del trabajador.'}<br>Huella SHA-256: ${esc(cierre.huella)}</p>` : ''}
    <div class="firmas"><div>Firma de la empresa</div><div>Firma del trabajador/a</div></div>
    <p class="legal">Registro diario de jornada conforme al art. 34.9 del Estatuto de los Trabajadores (Real Decreto-ley 8/2019). Las horas extraordinarias se totalizan mensualmente según el art. 35.5 ET. Las horas de los fichajes las fija el servidor en el momento del registro y no pueden alterarse; cualquier corrección consta con autor, fecha y motivo. Documento a conservar durante ${RETENCION_ANIOS} años (hasta ${hastaConserv(mes)}) a disposición de la persona trabajadora, sus representantes legales y la Inspección de Trabajo y Seguridad Social. Generado el ${fechaHora(new Date())}.</p></section>`).join('');
  audit('informe_pdf', lista.map(x => `${nombreDe(x.usuario)} ${x.mes}`).join(', '));
  setTimeout(() => window.print(), 50);
}

/* ================= ADMIN: auditoría ================= */
RUTAS['admin/auditoria'] = async el => {
  const logs = await q('auditoria', F.orderBy('ts', 'desc'), F.limit(400));
  const render = f => { f = f.toLowerCase(); $('#au-l').innerHTML = logs.filter(l => !f || `${l.autorNombre} ${l.accion} ${l.detalle}`.toLowerCase().includes(f)).map(l => `<tr><td>${fechaHora(toDate(l.ts))}</td><td>${esc(l.autorNombre)}</td><td><span class="tag">${esc(l.accion)}</span></td><td style="white-space:normal;min-width:220px">${esc(l.detalle)}</td></tr>`).join('') || '<tr><td colspan="4" class="empty">Sin resultados</td></tr>'; };
  el.innerHTML = `<h1>Auditoría</h1><p class="sub">Registro inalterable de todas las acciones (últimas 400). Nadie puede editarlo ni borrarlo.</p>
    <input id="au-q" placeholder="Filtrar…" style="margin:10px 0"><div class="card tw"><table><thead><tr><th>Fecha</th><th>Usuario</th><th>Acción</th><th>Detalle</th></tr></thead><tbody id="au-l"></tbody></table></div>
    <button class="btn sm" id="au-csv">Exportar CSV</button>`;
  $('#au-q').oninput = e => render(e.target.value); render('');
  $('#au-csv').onclick = () => descargar(`auditoria_${diaHoy()}.csv`, csv([['Fecha', 'Usuario', 'Acción', 'Detalle'], ...logs.map(l => [fechaHora(toDate(l.ts)), l.autorNombre, l.accion, l.detalle])]));
};

/* ================= ADMIN: ajustes ================= */
RUTAS['admin/ajustes'] = async el => {
  const e = S.empresa;
  el.innerHTML = `<h1>Ajustes</h1><form id="f-aj">
    <div class="card"><h3>Empresa</h3><label>Razón social</label><input name="nombre" value="${esc(e.nombre)}" required>
    <div class="grid2"><div><label>CIF</label><input name="cif" value="${esc(e.cif)}" required></div><div><label>Email privacidad</label><input name="emailEmpresa" value="${esc(e.emailEmpresa)}"></div></div>
    <label>Domicilio</label><input name="direccion" value="${esc(e.direccion)}"></div>
    <div class="card"><h3>Fichaje</h3>
    <label>Geolocalización</label><select name="geoModo"><option value="off">Desactivada</option><option value="registrar">Registrar si está disponible (no bloquea)</option><option value="obligatoria">Obligatoria para fichar</option></select>
    <div class="grid2"><div><label>Radio por defecto (m)</label><input name="radioDefectoM" type="number" value="${e.radioDefectoM ?? 300}"></div><div><label>Jornada diaria por defecto (h)</label><input name="jornadaDiariaH" type="number" step="0.25" value="${e.jornadaDiariaH ?? 8}"></div></div>
    <p class="note">La jornada diaria se usa para calcular horas extra los días sin turno asignado. Si hay turno, se compara con el turno.</p></div>
    <button class="btn pri block">Guardar ajustes</button><div class="err-box" id="aj-err"></div></form>
    <div class="card" style="margin-top:14px"><h3>Conservación de datos</h3><p class="sub">Los registros se guardan ${RETENCION_ANIOS} años como exige el art. 34.9 ET. La app no permite borrarlos; pasados los ${RETENCION_ANIOS} años pueden eliminarse desde Firebase Console.</p></div>`;
  $('#f-aj').geoModo.value = e.geoModo || 'registrar';
  $('#f-aj').onsubmit = async ev => {
    ev.preventDefault(); const f = ev.target;
    const data = { nombre: f.nombre.value.trim(), cif: f.cif.value.trim().toUpperCase(), emailEmpresa: f.emailEmpresa.value.trim(), direccion: f.direccion.value.trim(), geoModo: f.geoModo.value, radioDefectoM: +f.radioDefectoM.value || 300, jornadaDiariaH: +f.jornadaDiariaH.value || 8 };
    try { await F.updateDoc(F.doc(db, 'config', 'empresa'), data); Object.assign(S.empresa, data); audit('ajustes', JSON.stringify(data)); toast('Ajustes guardados', 'ok'); }
    catch (er) { $('#aj-err').textContent = errMsg(er); }
  };
};
