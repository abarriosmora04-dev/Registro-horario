<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0B0E17">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Controlpark">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Controlpark · Registro horario</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="img/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="img/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://www.gstatic.com" crossorigin>
<link rel="preconnect" href="https://firestore.googleapis.com" crossorigin>
<link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js">
<link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js">
<link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0B0E17;--bg2:#10141F;--card:#151A28;--card2:#1C2234;--line:#252C41;--line2:#30384F;
  --txt:#EEF1F8;--mut:#8D96AE;--dim:#5C6581;
  --brand:#5271FF;--brand2:#3D5AF1;--brandl:#94A6FF;--blue:#7C93FF;--blue2:#5271FF;
  --coral:#FF6B7A;--green:#34D399;--amber:#FBBF4B;
  --r:16px;--safe-b:env(safe-area-inset-bottom,0px);
  --shadow:0 10px 30px -12px rgba(0,0,0,.55);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{touch-action:manipulation;-webkit-text-size-adjust:100%;text-size-adjust:100%}
html,body{background:var(--bg);color:var(--txt);font:15px/1.45 Nunito,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;padding-bottom:calc(84px + var(--safe-b));background:radial-gradient(1200px 500px at 50% -200px,rgba(82,113,255,.16),transparent 70%) no-repeat,var(--bg)}
a{color:var(--blue)}
button,input,select,textarea{font:inherit;color:inherit}
.hidden{display:none!important}
.num,.tab{font-variant-numeric:tabular-nums}
/* cabecera */
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top,0px)) 16px 10px;background:rgba(11,14,23,.82);backdrop-filter:saturate(1.4) blur(14px);-webkit-backdrop-filter:saturate(1.4) blur(14px);border-bottom:1px solid rgba(37,44,65,.7)}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand .mk{width:34px;height:34px;border-radius:10px;background:var(--brand);display:grid;place-items:center;flex:none;box-shadow:0 6px 16px -6px rgba(82,113,255,.7)}
.brand .mk img{width:22px;height:22px}
.brand .wm{height:15px;display:block}
.brand small{display:block;font-size:11px;color:var(--mut);font-weight:600;letter-spacing:.3px;margin-top:2px}
.top .sp{flex:1}
.pill{font-size:12px;font-weight:700;padding:6px 12px;border-radius:99px;border:1px solid var(--line2);background:var(--card);color:var(--mut);cursor:pointer}
.pill.on{background:rgba(82,113,255,.16);border-color:rgba(82,113,255,.5);color:var(--brandl)}
.icobtn{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;color:var(--mut);cursor:pointer}
.icobtn svg{width:17px;height:17px}
.icobtn.girando svg{animation:sp .8s linear infinite}
main{max-width:980px;margin:0 auto;padding:18px 16px}
main.fade{animation:fade .18s ease-out}
@keyframes fade{from{opacity:.4;transform:translateY(4px)}to{opacity:1;transform:none}}
/* barra inferior */
.nav{position:fixed;left:10px;right:10px;bottom:calc(8px + var(--safe-b));z-index:30;display:flex;justify-content:space-around;background:rgba(21,26,40,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:20px;padding:6px;box-shadow:var(--shadow)}
@media(min-width:900px){.nav{left:50%;right:auto;transform:translateX(-50%);width:600px}}
.nav a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 2px 6px;text-decoration:none;color:var(--dim);font-size:11px;font-weight:700;border-radius:14px;position:relative;transition:color .15s,background .15s}
.nav a svg{width:22px;height:22px}
.nav a.act{color:#fff;background:linear-gradient(160deg,var(--brand),var(--brand2))}
.nav .badge{position:absolute;top:2px;right:calc(50% - 22px);background:var(--coral);color:#fff;font-size:10px;min-width:17px;height:17px;border-radius:9px;display:grid;place-items:center;padding:0 4px;border:2px solid var(--card)}
h1{font-size:24px;font-weight:800;letter-spacing:-.2px;margin-bottom:4px}
h2{font-size:15px;font-weight:800;margin:22px 0 10px;color:var(--txt)}
h3{font-size:15px;font-weight:800;margin-bottom:8px}
.sub{color:var(--mut);font-size:13px}
.card{background:linear-gradient(180deg,var(--card),rgba(21,26,40,.85));border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px}
.row{display:flex;align-items:center;gap:10px}
.row.wrap{flex-wrap:wrap}
.between{justify-content:space-between}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:13px 14px;position:relative;overflow:hidden}
.stat .v{font-size:20px;white-space:nowrap;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.3px}
.stat .l{font-size:12px;color:var(--mut);font-weight:600}
.stat::after{content:"";position:absolute;right:-18px;top:-18px;width:60px;height:60px;border-radius:50%;background:rgba(82,113,255,.08)}
/* formularios */
label{display:block;font-size:12px;font-weight:700;color:var(--mut);margin:12px 0 5px}
input,select,textarea{width:100%;font-size:16px;background:var(--bg2);border:1px solid var(--line2);border-radius:12px;padding:12px 13px;outline:none;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(82,113,255,.2)}
input:disabled{opacity:.6}
textarea{min-height:84px;resize:vertical}
input[type=checkbox]{width:18px;height:18px;accent-color:var(--brand)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:12px;padding:11px 16px;font-weight:800;cursor:pointer;background:var(--card2);color:var(--txt);border:1px solid var(--line2);text-decoration:none;transition:transform .08s,filter .15s}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.5;cursor:default}
.btn.pri{background:linear-gradient(160deg,var(--brand),var(--brand2));border-color:transparent;color:#fff;box-shadow:0 8px 20px -10px rgba(82,113,255,.9)}
.btn.danger{background:rgba(255,107,122,.1);border-color:rgba(255,107,122,.4);color:var(--coral)}
.btn.ok{background:rgba(52,211,153,.1);border-color:rgba(52,211,153,.4);color:var(--green)}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:10px}
.btn.block{width:100%}
.btn.ghost{background:transparent;border-color:transparent}
/* fichar */
.hero{position:relative;overflow:hidden;border-radius:24px;padding:22px 18px 20px;margin-bottom:14px;background:linear-gradient(150deg,#5B79FF 0%,#4363F5 45%,#2F47C9 100%);box-shadow:0 20px 40px -18px rgba(82,113,255,.75);color:#fff}
.hero::before{content:"";position:absolute;inset:0;background:url(img/icono-blanco.png) no-repeat right -40px top -30px/190px;opacity:.07;pointer-events:none}
.hero .hd{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.hero .date{font-weight:700;opacity:.85;text-transform:capitalize;font-size:14px}
.hero .clockt{font-size:40px;font-weight:800;letter-spacing:-.5px;line-height:1.05;font-variant-numeric:tabular-nums}
.hero .clockt span{font-size:20px;opacity:.65;font-weight:700}
.status{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:800;padding:6px 11px;border-radius:99px;background:rgba(255,255,255,.16);white-space:nowrap}
.status i{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.6)}
.status.trabajando i{background:#5CFFBC;box-shadow:0 0 0 4px rgba(92,255,188,.25);animation:pulse 1.6s infinite}
.status.pausa i{background:var(--amber)}
@keyframes pulse{50%{box-shadow:0 0 0 7px rgba(92,255,188,0)}}
.ringw{display:flex;align-items:center;gap:18px;margin-top:18px}
.ring{position:relative;width:118px;height:118px;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .in{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .in b{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.4px}
.ring .in small{font-size:11px;opacity:.8;font-weight:700}
.kv{display:grid;gap:9px;font-size:13px;flex:1;min-width:0}
.kv div{display:flex;justify-content:space-between;gap:8px;border-bottom:1px solid rgba(255,255,255,.14);padding-bottom:7px}
.kv div:last-child{border:0;padding:0}
.kv span{opacity:.8}.kv b{font-weight:800;font-variant-numeric:tabular-nums;text-align:right}
.geo-chip{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;margin-top:14px;padding:5px 10px;border-radius:99px;background:rgba(0,0,0,.18)}
.bigbtns{display:grid;gap:10px;margin-bottom:14px}
.bigbtns.two{grid-template-columns:1fr 1fr}
.fbtn{border:0;border-radius:20px;padding:20px 10px;font-size:18px;font-weight:800;cursor:pointer;color:#fff;display:flex;flex-direction:column;align-items:center;gap:3px;transition:transform .08s;letter-spacing:-.2px}
.fbtn:active{transform:scale(.97)}
.fbtn svg{width:26px;height:26px;margin-bottom:2px}
.fbtn small{font-weight:700;font-size:12px;opacity:.8}
.fbtn.in{background:linear-gradient(160deg,#34D399,#14A877);box-shadow:0 12px 26px -12px rgba(52,211,153,.8)}
.fbtn.out{background:linear-gradient(160deg,#FF8592,#F0506A);box-shadow:0 12px 26px -12px rgba(255,107,122,.8)}
.fbtn.pause{background:var(--card2);border:1px solid var(--line2);color:var(--amber)}
.fbtn.resume{background:var(--card2);border:1px solid var(--line2);color:var(--green)}
/* timeline */
.tl{list-style:none;position:relative}
.tl li{display:flex;gap:12px;align-items:center;padding:9px 0;font-size:14px;position:relative}
.tl .dot{width:10px;height:10px;border-radius:50%;flex:none;background:var(--dim);box-shadow:0 0 0 4px var(--card)}
.tl .dot.entrada{background:var(--green)}.tl .dot.salida{background:var(--coral)}.tl .dot.pausa_inicio,.tl .dot.pausa_fin{background:var(--amber)}
.tl li:not(:last-child)::before{content:"";position:absolute;left:4.5px;top:24px;bottom:-6px;width:1px;background:var(--line2)}
.tl .t{font-variant-numeric:tabular-nums;font-weight:800;width:46px}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:3px 9px;border-radius:99px;background:var(--card2);border:1px solid var(--line2);color:var(--mut);white-space:nowrap;text-decoration:none}
.tag.blue{color:var(--brandl);border-color:rgba(82,113,255,.4);background:rgba(82,113,255,.12)}
.tag.coral{color:var(--coral);border-color:rgba(255,107,122,.35);background:rgba(255,107,122,.08)}
.tag.green{color:var(--green);border-color:rgba(52,211,153,.35);background:rgba(52,211,153,.08)}
.tag.amber{color:var(--amber);border-color:rgba(251,191,75,.35);background:rgba(251,191,75,.08)}
/* listas */
.list .it{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.list .it:first-child{padding-top:2px}.list .it:last-child{border:0;padding-bottom:2px}
.list .it .grow{flex:1;min-width:0}
.list .it .t1{font-weight:800}
.list .it .t2{font-size:13px;color:var(--mut)}
.clickable{cursor:pointer}
.av{width:38px;height:38px;border-radius:12px;background:linear-gradient(150deg,rgba(82,113,255,.35),rgba(82,113,255,.12));border:1px solid rgba(82,113,255,.35);display:grid;place-items:center;font-size:13px;font-weight:800;color:#DCE3FF;flex:none}
/* tabla */
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--mut);font-weight:700;font-size:12px}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
/* días */
.day{border-bottom:1px solid var(--line);padding:12px 0}
.day:first-child{padding-top:2px}.day:last-child{border:0;padding-bottom:2px}
.day .hd{display:flex;align-items:center;gap:12px;cursor:pointer}
.day .dn,.dn2{width:44px;height:48px;border-radius:12px;background:var(--bg2);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;flex:none}
.day .dn b,.dn2 b{font-size:17px;line-height:1}
.day .dn span,.dn2 span{font-size:10px;color:var(--mut);text-transform:uppercase;font-weight:800;margin-top:3px}
.day .det{margin:10px 0 0 56px}
/* cuadrante */
.wk{display:grid;grid-template-columns:120px repeat(7,minmax(88px,1fr));min-width:740px;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--card)}
.wk>div{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:6px;font-size:12px;min-height:56px}
.wk .h{background:var(--bg2);color:var(--mut);min-height:auto;text-align:center;text-transform:capitalize;font-weight:700;padding:9px 4px}
.wk .h.today{color:#fff;background:rgba(82,113,255,.25)}
.wk .n{background:var(--bg2);font-weight:800;display:flex;align-items:center}
.wk .c{cursor:pointer;transition:background .12s}
.wk .c:hover{background:var(--card2)}
.sh{background:rgba(82,113,255,.16);border:1px solid rgba(82,113,255,.4);color:var(--txt);border-radius:8px;padding:4px 6px;margin-bottom:3px;font-variant-numeric:tabular-nums;font-weight:800}
.sh small{display:block;color:var(--mut);font-size:10px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ab{background:rgba(251,191,75,.12);border:1px solid rgba(251,191,75,.3);border-radius:8px;padding:4px 6px;color:var(--amber);margin-bottom:3px;font-weight:700}
/* editor de jornada y horarios */
.ed-row{background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:12px;margin-top:10px}
.ed-row.pausa{border-color:rgba(251,191,75,.3)}
.ed-row .eh{display:flex;justify-content:space-between;align-items:center;font-weight:800;font-size:13px}
.ed-g{display:grid;grid-template-columns:58px 1.15fr 1fr;gap:8px;align-items:center;margin-top:8px}
.ed-g span{font-size:12px;font-weight:800;color:var(--mut)}
.ed-g input{padding:10px 6px;min-width:0;width:100%;font-size:15px}
.ed-g input[type=date]::-webkit-calendar-picker-indicator,.ed-g input[type=time]::-webkit-calendar-picker-indicator{margin-left:2px;padding:0}
.ed-g.chg input{border-color:rgba(251,191,75,.6)}
.hd-row{display:grid;grid-template-columns:70px 1fr 1fr;gap:8px;align-items:center;margin-top:8px}
.hd-row .p2{grid-column:2/4;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.hd-row input[type=time]{padding:9px 6px;min-width:0}
.hd-row.off input[type=time]{opacity:.35}
.sw{display:flex;gap:8px;flex-wrap:wrap}
.sw button{width:30px;height:30px;border-radius:50%;border:2px solid transparent;cursor:pointer}
.sw button.on{border-color:#fff;box-shadow:0 0 0 2px var(--brand)}
.hz{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:middle}
.ck-list{max-height:220px;overflow:auto;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:4px 12px}
.ck-list label{margin:0;padding:9px 0;border-bottom:1px solid var(--line)}
.ck-list label:last-child{border:0}
/* modal */
.mbg{position:fixed;inset:0;z-index:50;background:rgba(5,7,12,.65);backdrop-filter:blur(3px);display:flex;align-items:flex-end;justify-content:center;animation:fade .15s}
@media(min-width:640px){.mbg{align-items:center}}
.modal{background:var(--card);border:1px solid var(--line2);width:100%;max-width:520px;max-height:92vh;overflow:auto;border-radius:24px 24px 0 0;padding:22px 18px calc(18px + var(--safe-b));animation:up .2s ease-out}
@keyframes up{from{transform:translateY(30px)}to{transform:none}}
@media(min-width:640px){.modal{border-radius:24px}}
.modal h2{margin-top:0;font-size:19px}
.modal .acts{display:flex;gap:10px;margin-top:20px}
.modal .acts .btn{flex:1}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + var(--safe-b));z-index:60;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
#toast div{background:var(--card2);border:1px solid var(--line2);padding:11px 16px;border-radius:14px;font-size:14px;font-weight:700;box-shadow:var(--shadow);max-width:90vw;animation:up .2s}
#toast div.err{border-color:rgba(255,107,122,.5);color:var(--coral)}
#toast div.ok{border-color:rgba(52,211,153,.5);color:var(--green)}
/* acceso */
.authw{min-height:100vh;display:flex;flex-direction:column}
.auth-hero{background:linear-gradient(160deg,#5B79FF,#3D5AF1 60%,#2F47C9);padding:calc(48px + env(safe-area-inset-top,0px)) 20px 70px;text-align:center;position:relative;overflow:hidden}
.auth-hero::after{content:"";position:absolute;left:-10%;right:-10%;bottom:-60px;height:120px;background:var(--bg);border-radius:50% 50% 0 0}
.auth-hero img{width:min(220px,60vw);display:block;margin:0 auto}
.auth-hero p{color:rgba(255,255,255,.85);font-weight:700;margin-top:12px;font-size:14px}
.auth{width:100%;max-width:400px;margin:-10px auto 40px;padding:0 20px;position:relative;z-index:1}
.empty{text-align:center;color:var(--mut);padding:24px 10px;font-size:14px}
.spin{width:26px;height:26px;border:3px solid var(--line2);border-top-color:var(--brand);border-radius:50%;animation:sp .8s linear infinite;margin:40px auto}
@keyframes sp{to{transform:rotate(360deg)}}
.skel{border-radius:var(--r);background:linear-gradient(90deg,var(--card) 0%,var(--card2) 50%,var(--card) 100%);background-size:200% 100%;animation:sk 1.1s infinite linear;margin-bottom:12px}
@keyframes sk{to{background-position:-200% 0}}
.seg{display:flex;background:var(--bg2);border:1px solid var(--line2);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:transparent;padding:9px;border-radius:9px;color:var(--mut);cursor:pointer;font-size:13px;font-weight:700}
.seg button.on{background:var(--brand);color:#fff}
.seg button:disabled{opacity:.4}
.note{font-size:12px;color:var(--mut);background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:11px;margin-top:12px}
.err-box{color:var(--coral);font-size:13px;font-weight:700;margin-top:8px;word-break:break-word}
hr{border:0;border-top:1px solid var(--line);margin:16px 0}
.chk{display:flex!important;gap:10px;align-items:center;font-size:14px;color:var(--txt);font-weight:600}
/* ================= ADMIN: tema cristal ================= */
body.adm{--bg:#0d1a4d;--bg2:rgba(255,255,255,.7);--card:rgba(255,255,255,.74);--card2:rgba(255,255,255,.62);--line:rgba(16,24,64,.08);--line2:rgba(16,24,64,.13);
  --txt:#101a3a;--mut:#5d6684;--dim:#8d95ad;--blue:#3d5af1;--brandl:#3d5af1;--green:#059669;--amber:#b7791f;--coral:#e11d48;
  --shadow:0 18px 40px -22px rgba(13,26,77,.55);color:var(--txt);padding-bottom:0;
  background:radial-gradient(900px 600px at 15% 0%,#3550d8 0%,transparent 60%),radial-gradient(900px 700px at 100% 100%,#6f8cff 0%,transparent 55%),linear-gradient(135deg,#0b1745 0%,#1b2f8f 55%,#4361f0 100%) fixed}
.adm .ash{display:grid;grid-template-columns:262px 1fr;min-height:100vh;gap:0}
.adm .side{position:sticky;top:0;height:100vh;overflow:auto;padding:18px 14px;display:flex;flex-direction:column;gap:2px;color:#fff;
  background:linear-gradient(180deg,rgba(255,255,255,.14),rgba(255,255,255,.06));border-right:1px solid rgba(255,255,255,.16);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
.adm .side-brand{display:flex;align-items:center;gap:10px;padding:6px 8px 18px}

// Aplica correcciones aprobadas a los fichajes originales (nunca se modifican los originales).
function eventosEfectivos(fichajes, correcciones) {
  const aprob = correcciones.filter(c => c.estado === 'aprobada').sort((a, b) => (toDate(a.resueltoTs) || 0) - (toDate(b.resueltoTs) || 0));
  let evs = fichajes.map(f => ({ ...f, ts: toDate(f.ts) }));
  for (const c of aprob) if (c.accion === 'anadir') evs.push({ id: 'c_' + c.id, uid: c.uid, tipo: c.tipo, ts: toDate(c.nuevoTs), dia: c.dia, mes: c.mes, anadido: true, correccion: c });
  for (const c of aprob) {
    if (c.accion === 'anular') evs = evs.filter(e => e.id !== c.fichajeId);
    if (c.accion === 'modificar') evs = evs.map(e => e.id === c.fichajeId ? { ...e, original: e.original || e.ts, ts: toDate(c.nuevoTs), modificado: true, correccion: c } : e);
  }
  return evs.filter(e => e.ts).sort((a, b) => a.ts - b.ts);
}
function calcularJornada(dia, eventos) {
  const j = { dia, eventos, tramos: [], pausas: [], incid: [], estado: 'fuera', ini: null, pIni: null, trabajadoMs: 0, pausaMs: 0, ultimo: null };
  for (const e of eventos) {
    j.ultimo = e.ts;
    if (e.tipo === 'entrada') { if (j.estado !== 'fuera') j.incid.push('Entrada sin salida previa'); j.estado = 'trabajando'; j.ini = e.ts; }
    else if (e.tipo === 'pausa_inicio') { if (j.estado !== 'trabajando') { j.incid.push('Pausa sin estar trabajando'); continue; } j.tramos.push([j.ini, e.ts]); j.pIni = e.ts; j.estado = 'pausa'; }
    else if (e.tipo === 'pausa_fin') { if (j.estado !== 'pausa') { j.incid.push('Fin de pausa sin pausa'); continue; } j.pausas.push([j.pIni, e.ts]); j.ini = e.ts; j.estado = 'trabajando'; }
    else if (e.tipo === 'salida') {
      if (j.estado === 'trabajando') j.tramos.push([j.ini, e.ts]);
      else if (j.estado === 'pausa') j.pausas.push([j.pIni, e.ts]);
      else j.incid.push('Salida sin entrada');
      j.estado = 'fuera';
    }
  }
  j.trabajadoMs = j.tramos.reduce((s, [a, b]) => s + (b - a), 0);
  j.pausaMs = j.pausas.reduce((s, [a, b]) => s + (b - a), 0);
  const entradas = eventos.filter(e => e.tipo === 'entrada'), salidas = eventos.filter(e => e.tipo === 'salida');
  j.primeraEntrada = entradas[0]?.ts || null; j.ultimaSalida = salidas.at(-1)?.ts || null;
  j.corregido = eventos.some(e => e.anadido || e.modificado);
  const abierta = j.estado !== 'fuera';
  if (abierta && dia < addDays(diaHoy(), -1)) j.incid.push('Falta fichaje de salida');
  else if (abierta && dia === addDays(diaHoy(), -1) && Date.now() - j.ultimo > 18 * 3600e3) j.incid.push('Falta fichaje de salida');
  return j;
}
const vivoMs = j => !j ? 0 : j.trabajadoMs + (j.estado === 'trabajando' ? Date.now() - j.ini : 0);
const pausaVivaMs = j => !j ? 0 : j.pausaMs + (j.estado === 'pausa' ? Date.now() - j.pIni : 0);
function jornadasPorDia(eventos) {
  const g = new Map(); for (const e of eventos) { if (!g.has(e.dia)) g.set(e.dia, []); g.get(e.dia).push(e); }
  const out = new Map(); for (const [d, evs] of g) out.set(d, calcularJornada(d, evs)); return out;
}
function groupBy(arr, k) { const m = new Map(); for (const x of arr) { const v = x[k]; if (!m.has(v)) m.set(v, []); m.get(v).push(x); } return m; }
function estadoActual(jornadas) {
  const hoy = diaHoy(), ayer = addDays(hoy, -1);
  const jA = jornadas.get(ayer), jH = jornadas.get(hoy);
  if (jH && jH.estado !== 'fuera') return { dia: hoy, j: jH };
  if (jA && jA.estado !== 'fuera' && Date.now() - jA.ultimo < 18 * 3600e3) return { dia: ayer, j: jA };
  return { dia: hoy, j: jH || null };
}
function ausenciaEn(ausencias, uid, dia) { return ausencias.find(a => a.uid === uid && a.estado === 'aprobada' && a.desde <= dia && a.hasta >= dia); }
// resumen de un mes para un empleado
function resumenMes(usuario, mes, jornadas, turnos, ausencias = []) {
  const tpd = groupBy(turnos.filter(t => t.uid === usuario.id), 'fecha');
  const filas = []; let tot = 0, extra = 0, prev = 0, dias = 0, incid = 0;
  for (const dia of diasDelMes(mes)) {
    const j = jornadas.get(dia); const ts = tpd.get(dia) || []; const aus = ausenciaEn(ausencias, usuario.id, dia);
    const prevista = ts.length ? ts.reduce((s, t) => s + turnoMin(t), 0) : null;
    const trab = j ? j.trabajadoMs : 0;
    let ex = 0;
    if (j && j.estado === 'fuera' && trab > 0) { const ref = prevista ?? jornadaDefMin(usuario); ex = Math.max(0, trab - ref * 60000); }
    if (j || ts.length || aus) filas.push({ dia, j, turnos: ts, prevista, trab, extra: ex, aus });
    if (j) { tot += trab; extra += ex; if (trab > 0) dias++; incid += j.incid.length; }
    if (prevista) prev += prevista * 60000;
  }
  return { filas, tot, extra, prev, dias, incid };
}

const col = n => F.collection(db, n);
// Caché en memoria: las pestañas ya visitadas se pintan al instante y se refrescan en segundo plano.
const W = (f, op, v) => ({ k: `${f}${op}${JSON.stringify(v)}`, c: F.where(f, op, v) });
const CACHE = new Map(), INFLIGHT = new Map(), TTL = 20000;
function cacheClear() { CACHE.clear(); }
const firma = d => { try { return JSON.stringify(d); } catch { return String(Math.random()); } };
async function fetchQ(key, n, conds) { const data = docsOf(await F.getDocs(F.query(col(n), ...conds))); CACHE.set(key, { t: Date.now(), data, sig: firma(data) }); return data; }
async function q(n, ...conds) {
  const key = n + '|' + conds.map(x => x.k || 'x').join('|');
  const real = conds.map(x => x.c || x);
  const hit = CACHE.get(key);
  if (hit) { if (Date.now() - hit.t > TTL && S.revalidar) S.revalidar.set(key, () => fetchQ(key, n, real)); return hit.data; }
  if (INFLIGHT.has(key)) return INFLIGHT.get(key);
  const pr = fetchQ(key, n, real).finally(() => INFLIGHT.delete(key)); INFLIGHT.set(key, pr); return pr;
}
async function qIn(n, field, values, ...conds) { // 'in' admite 30 valores
  const res = await Promise.all(chunk(values, 30).map(v => q(n, W(field, 'in', v), ...conds)));
  return res.flat();
}
function precargar() { // se ejecuta tras el primer pintado
  if (!S.user || !S.perfil) return;
  const uid = S.user.uid, hoy = diaHoy(), mes = hoy.slice(0, 7), t = [];
  t.push(q('turnos', W('uid', '==', uid), W('mes', 'in', [mes, addMonths(mes, 1)])), q('ausencias', W('uid', '==', uid)), q('correcciones', W('uid', '==', uid)), cargarMesUsuario(uid, mesSel));
  if (esAdmin()) {
    const meses = Array.from({ length: 6 }, (_, i) => addMonths(mes, i - 5)), sem = Array.from({ length: 7 }, (_, i) => addDays(semSel, i));
    t.push(qIn('fichajes', 'mes', meses), qIn('correcciones', 'mes', meses), q('turnos', W('mes', '==', mes)), q('turnos', W('fecha', '==', hoy)), q('ausencias', W('estado', '==', 'aprobada')), qIn('turnos', 'fecha', sem), q('correcciones', W('estado', '==', 'pendiente')), q('ausencias', W('estado', '==', 'pendiente')));
  }
  Promise.allSettled(t);
}
async function cargarCentros() { S.centros = (await q('centros')).sort((a, b) => a.nombre.localeCompare(b.nombre)); }
async function cargarUsuarios() { S.usuarios = (await q('usuarios')).sort((a, b) => nombreDe(a).localeCompare(nombreDe(b))); }
async function cargarMesUsuario(uid, mes) {
  const [fs, cs, ts, cis, aus] = await Promise.all([
    q('fichajes', W('uid', '==', uid), W('mes', '==', mes)),
    q('correcciones', W('uid', '==', uid), W('mes', '==', mes)),
    q('turnos', W('uid', '==', uid), W('mes', '==', mes)),
    q('cierres', W('uid', '==', uid), W('mes', '==', mes)),
    q('ausencias', W('uid', '==', uid)),
  ]);
  const evs = eventosEfectivos(fs, cs);
  return { fichajes: fs, correcciones: cs, eventos: evs, jornadas: jornadasPorDia(evs), turnos: ts, cierres: cis.sort((a, b) => (toDate(b.creadoTs) || 0) - (toDate(a.creadoTs) || 0)), ausencias: aus };
}

async function start() {
  const [fa, fau, ffs] = await Promise.all([import(FB + 'firebase-app.js'), import(FB + 'firebase-auth.js'), import(FB + 'firebase-firestore.js')]);
  F = { ...fa, ...fau, ...ffs };
  app = F.initializeApp(firebaseConfig);
  auth = F.getAuth(app);
  auth.languageCode = 'es'; // emails de Firebase en español
  db = F.getFirestore(app);
  for (const fn of ['addDoc', 'setDoc', 'updateDoc', 'deleteDoc']) { // toda escritura invalida la caché (salvo la auditoría)
    const orig = F[fn]; F[fn] = async (...a) => { const r = await orig(...a); if (a[0]?.path !== 'auditoria') cacheClear(); return r; };
  }
  const wb = F.writeBatch; F.writeBatch = d => { const b = wb(d); const c = b.commit.bind(b); b.commit = async () => { const r = await c(); cacheClear(); return r; }; return b; };
  if (firebaseConfig.emulador && location.hostname === 'localhost') { // solo para pruebas locales
    F.connectAuthEmulator(auth, 'http://127.0.0.1:9099', { disableWarnings: true });
    F.connectFirestoreEmulator(db, '127.0.0.1', 8085);
  }
  window.addEventListener('hashchange', route);
  F.onAuthStateChanged(auth, async u => {
    clearInterval(S.timer);
    if (!u) {
      S.user = S.perfil = null;
      const emp = await F.getDoc(F.doc(db, 'config', 'empresa'));
      S.empresa = emp.exists() ? emp.data() : null;
      return S.empresa ? renderLogin() : renderSetup();
    }
    try {
      S.user = u; cacheClear();
      const [p, emp] = await Promise.all([F.getDoc(F.doc(db, 'usuarios', u.uid)), F.getDoc(F.doc(db, 'config', 'empresa'))]);
      if (!p.exists() || !p.data().activo) { S.aviso = 'Tu usuario no está dado de alta o está de baja. Contacta con el administrador.'; await F.signOut(auth); return; }
      S.perfil = { id: u.uid, ...p.data() };
      S.empresa = emp.data() || {};
      await Promise.all([cargarCentros(), esAdmin() ? cargarUsuarios() : (S.usuarios = [S.perfil])]);
      if (!sessionStorage.getItem('cp_login_' + u.uid)) { sessionStorage.setItem('cp_login_' + u.uid, '1'); audit('acceso', 'Inicio de sesión'); }
      if (!location.hash || location.hash === '#/') location.hash = esAdmin() && matchMedia('(min-width:900px)').matches ? '#/admin/panel' : '#/fichar';
      else route();
      contarPendientes();
      setTimeout(precargar, 800);
    } catch (e) { fail($('#app'), e); }
  });
}

// Pide la ubicación de dos formas a la vez (rápida por red y precisa por GPS) y se queda con la mejor.
// Antes solo se pedía GPS de alta precisión con 12 s de margen: en interiores el GPS no respondía a tiempo.
function obtenerUbicacion() {
  return new Promise(res => {
    if (!navigator.geolocation) return res({ error: 'no_soportado' });
    let mejor = null, hecho = false, ultimoErr = null, w = null;
    const fin = () => {
      if (hecho) return; hecho = true; if (w != null) navigator.geolocation.clearWatch(w); clearTimeout(t1); clearTimeout(t2);
      if (mejor) return res({ lat: +mejor.coords.latitude.toFixed(6), lng: +mejor.coords.longitude.toFixed(6), precision: Math.round(mejor.coords.accuracy) });
      res({ error: ultimoErr === 1 ? 'denegado' : ultimoErr === 3 ? 'tiempo_agotado' : 'no_disponible' });
    };
    const ok = p => { if (!mejor || p.coords.accuracy < mejor.coords.accuracy) mejor = p; if (p.coords.accuracy <= 60) fin(); };
    const ko = e => { ultimoErr = e.code; if (e.code === 1) fin(); };
    navigator.geolocation.getCurrentPosition(ok, ko, { enableHighAccuracy: false, maximumAge: 120000, timeout: 20000 });
    try { w = navigator.geolocation.watchPosition(ok, ko, { enableHighAccuracy: true, maximumAge: 0, timeout: 20000 }); } catch { }
    const t2 = setTimeout(() => { if (mejor) fin(); }, 5000); // con una posición aceptable en 5 s, no esperamos más
    const t1 = setTimeout(fin, 20000);
  });
}

async function fichar(tipo, diaJornada, turno) {
  if (!navigator.onLine) return toast('Sin conexión. Conéctate para fichar: la hora la pone el servidor.', 'err');

  if (modo !== 'off' && !(await avisoGeo())) { if (modo === 'obligatoria') return toast('Debes aceptar la información de ubicación para fichar.', 'err'); }
  const m = modal(`<h2 style="text-align:center">${TIPOS[tipo]}</h2><div class="spin"></div><p class="sub" style="text-align:center">${modo !== 'off' && S.perfil.geoAceptadoTs ? 'Obteniendo tu ubicación…' : 'Registrando…'}</p>`);
  try {
    let geo = null, geoError = null, distanciaM = null, fueraRadio = false;
    if (modo !== 'off' && S.perfil.geoAceptadoTs) {
      const r = await obtenerUbicacion();
      if (r.error) { geoError = r.error; if (modo === 'obligatoria') { m.close(); return toast('No se pudo obtener tu ubicación. Activa la localización para fichar.', 'err'); } }
      else geo = r;
    }
    const centroId = turno?.centroId || S.perfil.centroId || null;
    const c = centroById(centroId);
    if (geo && c?.lat != null && c?.lng != null) {
      distanciaM = Math.round(haversine(geo, { lat: +c.lat, lng: +c.lng }));
      fueraRadio = distanciaM > (+c.radioM || S.empresa.radioDefectoM || 300) + Math.min(geo.precision || 0, 200);
    }
    await F.addDoc(col('fichajes'), {
      uid: S.user.uid, tipo, ts: F.serverTimestamp(), tsCliente: Date.now(), dia: diaJornada, mes: diaJornada.slice(0, 7),
      centroId, geo, geoError, distanciaM, fueraRadio, dispositivo: navigator.userAgent.slice(0, 160),
    });
    audit('fichaje', `${TIPOS[tipo]}${fueraRadio ? ` (fuera de zona, ${distanciaM} m)` : ''}`);
    m.close();
    const geoTxt = geo ? (distanciaM != null ? (fueraRadio ? ` · ubicación a ${distanciaM} m del centro` : ' · ubicación verificada') : ' · ubicación registrada') : (geoError ? ` · sin ubicación: ${GEO_ERR[geoError] || geoError}` : '');
    toast(`${TIPOS[tipo]} registrada a las ${hora(new Date())}${geoTxt}`, fueraRadio ? '' : 'ok');
    if (geoError && geoError !== 'tiempo_agotado' && !sessionStorage.getItem('cp_geo_help')) { sessionStorage.setItem('cp_geo_help', '1'); setTimeout(ayudaGeo, 600); }
    if (navigator.vibrate) navigator.vibrate(60);
    route();
  } catch (e) { m.close(); toast(errMsg(e), 'err'); }
}

        ${e.modificado ? `<span class="tag amber" title="${esc(e.correccion?.motivo)}">antes ${hora(e.original)}</span>` : ''}${e.anadido ? `<span class="tag amber" title="${esc(e.correccion?.motivo)}">añadido</span>` : ''}

// Editor de jornada: se corrigen entrada y salida (y pausas) a la vez.
// Cada cambio genera un registro de corrección trazable; los fichajes originales nunca se tocan.
function paresJornada(evs) {
  const rows = []; let cur = null, pz = null;
  for (const e of evs) {
    if (e.tipo === 'entrada') { if (cur) rows.push(cur); cur = { k: 'jornada', a: e, b: null }; }
    else if (e.tipo === 'salida') { if (cur) { cur.b = e; rows.push(cur); cur = null; } else rows.push({ k: 'jornada', a: null, b: e }); }
    else if (e.tipo === 'pausa_inicio') { if (pz) rows.push(pz); pz = { k: 'pausa', a: e, b: null }; }
    else if (e.tipo === 'pausa_fin') { if (pz) { pz.b = e; rows.push(pz); pz = null; } else rows.push({ k: 'pausa', a: null, b: e }); }
  }
  if (cur) rows.push(cur); if (pz) rows.push(pz);
  const t = r => (r.a || r.b).ts;
  return [...rows.filter(r => r.k === 'jornada').sort((x, y) => t(x) - t(y)), ...rows.filter(r => r.k === 'pausa').sort((x, y) => t(x) - t(y))];
}
function modalCorreccion(usuario, dia, jornada, admin, onDone, turnosDia = []) {
  const evs = jornada?.eventos || [];
  let rows = paresJornada(evs).map(r => ({ ...r, quitada: false }));
  if (!rows.length) { // día sin fichajes: propone el turno previsto
    const ts = turnosDia.slice().sort((x, y) => x.inicio.localeCompare(y.inicio));
    rows = (ts.length ? ts : [null]).map(t => ({ k: 'jornada', a: null, b: null, quitada: false, pre: t ? { ai: t.inicio, bi: t.fin } : null }));
  }
  const LBL = { jornada: ['Entrada', 'Salida', 'Tramo de trabajo'], pausa: ['Inicio', 'Fin', 'Pausa'] };
  const finDia = (ini, fin) => (ini && fin && fin <= ini) ? addDays(dia, 1) : dia;
  const vals = (r, lado) => { const e = r[lado]; if (e) return [diaDe(e.ts), hora(e.ts)]; if (r.pre) { const h = lado === 'a' ? r.pre.ai : r.pre.bi; return [lado === 'b' ? finDia(r.pre.ai, r.pre.bi) : dia, h]; } return [dia, '']; };
  const m = modal(`<h2>${admin ? 'Corregir jornada' : 'Solicitar corrección'}</h2>
    <p class="sub">${esc(nombreDe(usuario))} · ${diaCorto(dia)} ${dia.slice(0, 4)}</p>
    <div id="ed"></div>
    <div class="row" style="margin-top:10px"><button class="btn sm" id="ed-addj">+ Tramo de trabajo</button><button class="btn sm" id="ed-addp">+ Pausa</button></div>
    <label>Motivo (obligatorio)</label><textarea id="c-mot" placeholder="Ej.: olvidé fichar la salida al terminar el turno"></textarea>
    <p class="note">${admin ? 'Los cambios se aplican al momento y quedan registrados con tu nombre, fecha y motivo.' : 'El administrador revisará la solicitud.'} Los fichajes originales se conservan siempre. Si la salida es al día siguiente, cambia su fecha.</p>
    <div class="err-box" id="c-err"></div>
    <div class="acts"><button class="btn" data-close>Cancelar</button><button class="btn pri" id="c-ok">${admin ? 'Guardar cambios' : 'Enviar solicitud'}</button></div>`);
  const pintar = () => {
    let nj = 0, np = 0;
    $('#ed', m).innerHTML = rows.map((r, i) => {
      if (r.quitada) return '';
      const n = r.k === 'jornada' ? ++nj : ++np; const [la, lb, tit] = LBL[r.k]; const [da, ha] = vals(r, 'a'), [db_, hb] = vals(r, 'b');
      return `<div class="ed-row ${r.k}" data-i="${i}"><div class="eh"><span>${tit}${(r.k === 'jornada' ? nj : np) > 1 || rows.filter(x => x.k === r.k && !x.quitada).length > 1 ? ' ' + n : ''}</span><button class="btn sm ghost" data-rm="${i}" style="color:var(--coral)">Quitar</button></div>
        <div class="ed-g" data-l="a"><span>${la}</span><input type="date" value="${da}" data-f="d"><input type="time" value="${ha}" data-f="h"></div>
        <div class="ed-g" data-l="b"><span>${lb}</span><input type="date" value="${db_}" data-f="d"><input type="time" value="${hb}" data-f="h"></div></div>`;
    }).join('') || '<div class="empty">Sin tramos. Añade uno o guarda para anular los fichajes del día.</div>';
    $$('[data-rm]', m).forEach(b => b.onclick = () => { leer(); rows[+b.dataset.rm].quitada = true; pintar(); });
    // si cambia la hora de entrada y la salida queda antes, pasa la salida al día siguiente
    $$('.ed-row', m).forEach(row => $$('input', row).forEach(inp => inp.onchange = () => {
      const g = x => $(`[data-l="${x}"] [data-f="${inp.dataset.f}"]`, row);
      const ha = $('[data-l="a"] [data-f="h"]', row).value, hb = $('[data-l="b"] [data-f="h"]', row).value;
      if (ha && hb && $('[data-l="a"] [data-f="d"]', row).value === dia) $('[data-l="b"] [data-f="d"]', row).value = hb <= ha ? addDays(dia, 1) : dia;
      $$('.ed-g', row).forEach(gr => gr.classList.add('chg'));
    }));
  };
  const leer = () => $$('.ed-row', m).forEach(row => { const r = rows[+row.dataset.i]; for (const l of ['a', 'b']) { r['v' + l] = [$(`[data-l="${l}"] [data-f="d"]`, row).value, $(`[data-l="${l}"] [data-f="h"]`, row).value]; } });
  pintar();
  $('#ed-addj', m).onclick = () => { leer(); rows.push({ k: 'jornada', a: null, b: null, quitada: false, pre: null }); pintar(); };
  $('#ed-addp', m).onclick = () => { leer(); rows.push({ k: 'pausa', a: null, b: null, quitada: false, pre: null }); pintar(); };
  $('#c-ok', m).onclick = async () => {
    leer(); const err = $('#c-err', m); err.textContent = '';
    const mot = $('#c-mot', m).value.trim(); if (mot.length < 5) return err.textContent = 'Explica el motivo (mínimo 5 caracteres).';
    const ops = [], ahora = new Date();
    const tipoDe = (k, l) => k === 'jornada' ? (l === 'a' ? 'entrada' : 'salida') : (l === 'a' ? 'pausa_inicio' : 'pausa_fin');
    for (const r of rows) {
      if (r.quitada) { for (const l of ['a', 'b']) if (r[l]) ops.push({ accion: 'anular', ev: r[l] }); continue; }
      const t = {};
      for (const l of ['a', 'b']) {
        const [d, h] = r['v' + l] || ['', '']; t[l] = d && h ? madridDate(d, h) : null;
        if (t[l] && t[l] > ahora) return err.textContent = `${LBL[r.k][l === 'a' ? 0 : 1]}: no se puede registrar una hora futura.`;
      }
      if (t.a && t.b && t.b < t.a) return err.textContent = `${LBL[r.k][2]}: la ${r.k === 'jornada' ? 'salida' : 'vuelta'} debe ser posterior al inicio.`;
      for (const l of ['a', 'b']) {
        const ev = r[l], nt = t[l];
        if (ev && !nt) ops.push({ accion: 'anular', ev });
        else if (ev && nt && Math.abs(nt - ev.ts) >= 60000) ops.push({ accion: 'modificar', ev, nt });
        else if (!ev && nt) ops.push({ accion: 'anadir', tipo: tipoDe(r.k, l), nt });
      }
    }
    if (!ops.length) return err.textContent = 'No has cambiado nada.';
    const b = F.writeBatch(db);
    for (const o of ops) {
      const data = { uid: usuario.id, dia, mes: dia.slice(0, 7), accion: o.accion, motivo: mot, autorUid: S.user.uid, creadoTs: F.serverTimestamp() };
      if (o.nt) data.nuevoTs = F.Timestamp.fromDate(o.nt);
      if (o.ev) { data.fichajeId = o.ev.id; data.tipo = o.ev.tipo; data.valorAnterior = F.Timestamp.fromDate(o.ev.ts); } else data.tipo = o.tipo;
      if (admin) Object.assign(data, { estado: 'aprobada', resueltoPor: S.user.uid, resueltoTs: F.serverTimestamp(), respuesta: 'Corrección directa del administrador' });
      else data.estado = 'pendiente';
      b.set(F.doc(col('correcciones')), data);
    }
    try {
      await b.commit();
      const desc = ops.map(o => `${{ anadir: 'añade', modificar: 'cambia', anular: 'anula' }[o.accion]} ${TIPOS[o.tipo || o.ev.tipo]}${o.ev ? ' ' + hora(o.ev.ts) : ''}${o.nt ? ' → ' + hora(o.nt) : ''}`).join(', ');
      audit(admin ? 'correccion_aplicada' : 'correccion_solicitada', `${nombreDe(usuario)} · ${diaFmt(dia)} · ${desc} · ${mot}`, { uidAfectado: usuario.id });
      m.close(); toast(admin ? 'Jornada corregida' : 'Solicitud enviada', 'ok'); onDone && onDone();
    } catch (e) { err.textContent = errMsg(e); }
  };
}

function saludo() { const h = +fHora.format(new Date()).slice(0, 2); return h < 6 ? 'Buenas noches' : h < 14 ? 'Buenos días' : h < 21 ? 'Buenas tardes' : 'Buenas noches'; }
function graficoBarras(datos, { alto = 210 } = {}) {
  const W = 640, H = alto, pl = 38, pb = 26, pt = 22, n = datos.length; const max = Math.max(1, ...datos.map(d => d.v));
  const paso = [1, 2, 5, 10, 20, 25, 50, 100, 200, 250, 500, 1000].find(x => max / x <= 4) || 1000; const top = Math.ceil(max / paso) * paso;
  const bw = Math.min(46, (W - pl) / n * 0.5), y = v => pt + (H - pt - pb) * (1 - v / top), x = i => pl + (W - pl) / n * (i + .5);
  let g = '';
  for (let t = 0; t <= top; t += paso) g += `<line x1="${pl}" x2="${W}" y1="${y(t)}" y2="${y(t)}" stroke="rgba(16,24,64,.07)"/><text x="${pl - 8}" y="${y(t) + 4}" text-anchor="end">${t}h</text>`;
  const barras = datos.map((d, i) => { const h = Math.max(3, H - pb - y(d.v)), ult = i === n - 1;
    return `<g><title>${esc(d.titulo || d.l)}: ${d.v.toFixed(1).replace('.', ',')} h</title><rect x="${x(i) - bw / 2}" y="${H - pb - h}" width="${bw}" height="${h}" rx="9" fill="url(#${ult ? 'gb2' : 'gb1'})"/>
      ${ult || d.v === max ? `<text class="vl" x="${x(i)}" y="${H - pb - h - 7}" text-anchor="middle">${Math.round(d.v)}h</text>` : ''}<text x="${x(i)}" y="${H - 7}" text-anchor="middle">${esc(d.l)}</text></g>`; }).join('');
  return `<svg class="bars" viewBox="0 0 ${W} ${H}" width="100%" style="display:block"><defs><linearGradient id="gb1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9fb2ff"/><stop offset="1" stop-color="#c9d4ff"/></linearGradient><linearGradient id="gb2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5271ff"/><stop offset="1" stop-color="#3d5af1"/></linearGradient></defs>${g}${barras}</svg>`;
}

  const tot = partes.reduce((s, p) => s + p.v, 0) || 1, R = 70, C = 2 * Math.PI * R; let acc = 0;

  return `<svg viewBox="0 0 180 180" width="190" height="190"><g transform="rotate(-90 90 90)"><circle cx="90" cy="90" r="${R}" fill="none" stroke="#eef1ff" stroke-width="22"/>${segs}</g>
    <text x="90" y="88" text-anchor="middle" style="font:800 22px Nunito,sans-serif;fill:#101a3a">${esc(centro)}</text><text x="90" y="108" text-anchor="middle" style="font:700 11px Nunito,sans-serif;fill:#8d95ad">${esc(sub)}</text></svg>`;
}

const horarios = () => S.empresa.horarios || [];
const minRango = r => r?.i && r?.f ? turnoMin({ inicio: r.i, fin: r.f }) : 0;
function resumenHorario(h) {
  const g = []; // agrupa días consecutivos con el mismo horario: "L–V 08:00–15:00 · S 09:00–13:00"
  for (let d = 1; d <= 7; d++) {
    const t = (h.dias?.[d] || []).map(r => `${r.i}–${r.f}`).join(' y ');
    if (!t) continue; const ult = g.at(-1);
    if (ult && ult.t === t && ult.hasta === d - 1) ult.hasta = d; else g.push({ desde: d, hasta: d, t });
  }
  const L = ['', 'L', 'M', 'X', 'J', 'V', 'S', 'D'];
  return g.map(x => `${L[x.desde]}${x.hasta > x.desde ? '–' + L[x.hasta] : ''} ${x.t}`).join(' · ') || 'Sin días';
}
const horasSemana = h => Object.values(h.dias || {}).flat().reduce((s, r) => s + minRango(r), 0);
async function guardarHorarios(lista, accion, det) {
  await F.updateDoc(F.doc(db, 'config', 'empresa'), { horarios: lista });

}

async function crearCierre(u, mes, res, eventos) {
  if (res.incid) { if (!(await confirmar('Hay incidencias', `Este mes tiene ${res.incid} incidencia(s) sin resolver. ¿Cerrar igualmente?`))) return; }
  const m = modal(`<h2>Cerrar ${mesNombre(mes)}</h2><p class="sub">${esc(nombreDe(u))}</p>
    <div class="grid2" style="margin:12px 0"><div class="stat"><div class="v">${dur(res.tot)}</div><div class="l">Trabajadas</div></div><div class="stat"><div class="v">${dur(res.extra)}</div><div class="l">Extra</div></div></div>
    <label>Compensación de horas extraordinarias</label><select id="cc"><option value="ninguna">Sin horas extra / no aplica</option><option value="pago">Retribuidas</option><option value="descanso">Compensadas con descanso</option></select>
    <p class="note">Se guarda una huella SHA-256 del registro del mes. El empleado podrá revisarlo y firmarlo desde su móvil (art. 35.5 ET: totalización mensual de horas extra con copia al trabajador).</p>
    <div class="acts"><button class="btn" data-close>Cancelar</button><button class="btn pri" id="cok">Cerrar mes</button></div>`);
  $('#cc', m).value = res.extra ? 'pago' : 'ninguna';
  $('#cok', m).onclick = async () => {
    const canon = JSON.stringify(eventos.map(e => [e.id, e.tipo, e.ts.toISOString(), e.dia]));
    const huella = await sha256(`${u.id}|${mes}|${canon}`);
    try {
      await F.addDoc(col('cierres'), { uid: u.id, mes, trabajadoMs: res.tot, extraMs: res.extra, previstoMs: res.prev, dias: res.dias, compensacion: $('#cc', m).value, huella, nEventos: eventos.length, creadoPor: S.user.uid, creadoTs: F.serverTimestamp() });
      audit('cierre_mes', `${nombreDe(u)} · ${mesNombre(mes)} · ${dur(res.tot)} (+${dur(res.extra)})`, { uidAfectado: u.id });
      m.close(); toast('Mes cerrado. Pendiente de firma del empleado.', 'ok'); route();
    } catch (e) { toast(errMsg(e), 'err'); }
  };
}

    <div class="grid2"><div class="stat"><div class="v">${dur(T.tot)}</div><div class="l">Horas totales plantilla</div></div><div class="stat"><div class="v">${dur(T.extra)}</div><div class="l">Horas extra</div></div></div>
    <div class="row wrap" style="margin:12px 0"><button class="btn sm" id="i-pdf">PDF de todos</button><button class="btn sm" id="i-csv">CSV jornadas</button><button class="btn sm" id="i-raw">CSV registros originales + correcciones</button></div>
    <div class="card tw"><table><thead><tr><th>Empleado</th><th class="num">Días</th><th class="num">Trabajadas</th><th class="num">Previstas</th><th class="num">Extra</th><th>Incid.</th><th>Cierre</th><th></th></tr></thead><tbody>
    ${filas.map((f, i) => `<tr><td>${esc(nombreDe(f.u))}</td><td class="num">${f.res.dias}</td><td class="num">${dur(f.res.tot)}</td><td class="num">${dur(f.res.prev)}</td><td class="num">${dur(f.res.extra)}</td><td>${f.res.incid ? `<span class="tag coral">${f.res.incid}</span>` : ''}</td><td>${f.cierre ? (f.cierre.firmadoTs ? `<span class="tag ${f.cierre.firmaConforme ? 'green' : 'coral'}">firmado</span>` : '<span class="tag amber">sin firmar</span>') : '<span class="tag">abierto</span>'}</td><td><button class="btn sm" data-ver="${f.u.id}">Ver</button> <button class="btn sm" data-pdf="${i}">PDF</button></td></tr>`).join('')}
    </tbody></table></div>
    <p class="note">Para la Inspección de Trabajo: "CSV registros originales + correcciones" contiene cada fichaje tal como se hizo (hora del servidor, ubicación) y cada corrección con autor, fecha y motivo. Los registros no pueden modificarse ni borrarse.</p>`;
  nm.bind(el);
  $$('[data-ver]', el).forEach(b => b.onclick = () => { regSel.uid = b.dataset.ver; location.hash = '#/admin/registros'; });
  $$('[data-pdf]', el).forEach(b => b.onclick = () => { const f = filas[+b.dataset.pdf]; imprimir([{ usuario: f.u, mes: mesSel, res: f.res, cierre: f.cierre }]); });
  $('#i-pdf').onclick = () => imprimir(filas.filter(f => f.res.filas.length).map(f => ({ usuario: f.u, mes: mesSel, res: f.res, cierre: f.cierre })));
  $('#i-csv').onclick = () => {
    const rows = [['Empleado', 'DNI', 'Fecha', 'Centro', 'Turno previsto', 'Primera entrada', 'Última salida', 'Tramos', 'Pausas (h)', 'Trabajadas (h)', 'Extra (h)', 'Corregido', 'Incidencias', 'Ausencia']];
    filas.forEach(({ u, res }) => res.filas.forEach(r => rows.push([nombreDe(u), u.dni, diaFmt(r.dia), centroById(r.j?.eventos[0]?.centroId || r.turnos[0]?.centroId)?.nombre || '', r.turnos.map(t => `${t.inicio}-${t.fin}`).join(' '), r.j?.primeraEntrada ? hora(r.j.primeraEntrada) : '', r.j?.ultimaSalida ? hora(r.j.ultimaSalida) : '', r.j ? r.j.tramos.map(([a, b]) => `${hora(a)}-${hora(b)}`).join(' ') : '', r.j ? horasDec(r.j.pausaMs) : '', horasDec(r.trab), horasDec(r.extra), r.j?.corregido ? 'Sí' : '', (r.j?.incid || []).join(', '), r.aus ? AUSENCIAS[r.aus.tipo] : ''])));
    descargar(`jornadas_${mesSel}.csv`, csv(rows)); audit('exportacion', `CSV jornadas ${mesSel}`);
  };
  $('#i-raw').onclick = () => {
    const rows = [['Registro', 'ID', 'Empleado', 'DNI', 'Jornada', 'Tipo/acción', 'Fecha-hora (servidor)', 'Hora nueva', 'Hora anterior', 'Centro', 'Latitud', 'Longitud', 'Precisión (m)', 'Distancia centro (m)', 'Fuera de zona', 'Estado', 'Motivo', 'Autor', 'Resuelto por', 'Resuelto el', 'Conservar hasta']];
    const hasta = d => { const x = new Date(d); x.setFullYear(x.getFullYear() + RETENCION_ANIOS); return diaFmt(diaDe(x)); };
    fs.slice().sort((a, b) => toDate(a.ts) - toDate(b.ts)).forEach(f => { const u = userById(f.uid); rows.push(['Fichaje', f.id, nombreDe(u), u?.dni, diaFmt(f.dia), TIPOS[f.tipo], fechaHora(toDate(f.ts)), '', '', centroById(f.centroId)?.nombre || '', f.geo?.lat ?? '', f.geo?.lng ?? '', f.geo?.precision ?? '', f.distanciaM ?? '', f.fueraRadio ? 'Sí' : '', 'Original', '', nombreDe(u), '', '', hasta(toDate(f.ts))]); });
    cs.slice().sort((a, b) => toDate(a.creadoTs) - toDate(b.creadoTs)).forEach(c => { const u = userById(c.uid); rows.push(['Corrección', c.id, nombreDe(u), u?.dni, diaFmt(c.dia), `${c.accion} ${TIPOS[c.tipo] || ''}`, fechaHora(toDate(c.creadoTs)), c.nuevoTs ? fechaHora(toDate(c.nuevoTs)) : '', c.valorAnterior ? fechaHora(toDate(c.valorAnterior)) : '', '', '', '', '', '', '', c.estado, c.motivo, nombreDe(userById(c.autorUid)), c.resueltoPor ? nombreDe(userById(c.resueltoPor)) : '', c.resueltoTs ? fechaHora(toDate(c.resueltoTs)) : '', hasta(toDate(c.creadoTs))]); });
    descargar(`registro_jornada_${mesSel}_inspeccion.csv`, csv(rows)); audit('exportacion', `CSV registros originales ${mesSel}`);
  };
};

// Genera un PDF de verdad (funciona en iPhone y en la app instalada, donde window.print() no hace nada).
function cargarScript(src) { return new Promise((ok, ko) => { if ([...document.scripts].some(x => x.src === src)) return ok(); const sc = document.createElement('script'); sc.src = src; sc.onload = ok; sc.onerror = () => ko(new Error('No se pudo cargar el generador de PDF. Revisa la conexión.')); document.head.appendChild(sc); }); }
async function imgData(src) { const b = await (await fetch(src)).blob(); return new Promise(r => { const fr = new FileReader(); fr.onload = () => r(fr.result); fr.readAsDataURL(b); }); }
async function imprimir(lista) {
  if (!lista.length) return toast('No hay datos para el informe');
  const m = modal(`<h2 style="text-align:center">Generando PDF</h2><div class="spin"></div>`);
  try {
    await cargarScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js');
    await cargarScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js');
    const { jsPDF } = window.jspdf; const doc = new jsPDF({ unit: 'mm', format: 'a4' });
    const logo = await imgData('img/icon-192.png').catch(() => null);
    const e = S.empresa, AZ = [82, 113, 255], W = 210, M = 14;
    const hastaConserv = mes => { const [y, mm] = mes.split('-').map(Number); return `${new Date(Date.UTC(y, mm, 0)).getUTCDate()}/${pad(mm)}/${y + RETENCION_ANIOS}`; };
    const txt = (t, x, y, o = {}) => { doc.setFont('helvetica', o.b ? 'bold' : 'normal'); doc.setFontSize(o.s || 9); doc.setTextColor(...(o.c || [20, 20, 30])); doc.text(Array.isArray(t) ? t : String(t), x, y, o.a ? { align: o.a, maxWidth: o.w } : { maxWidth: o.w }); };
    lista.forEach(({ usuario: u, mes, res, cierre }, idx) => {
      if (idx) doc.addPage();
      if (logo) doc.addImage(logo, 'PNG', M, 12, 14, 14);
      txt('Registro diario de jornada', M + 18, 18, { b: 1, s: 15 });
      txt(mesNombre(mes).replace(/^./, c => c.toUpperCase()), M + 18, 24, { s: 10, c: [90, 98, 120] });
      doc.setDrawColor(...AZ); doc.setLineWidth(0.6); doc.line(M, 30, W - M, 30);
      txt('Empresa', M, 37, { b: 1, s: 8, c: [90, 98, 120] }); txt('Trabajador/a', W / 2, 37, { b: 1, s: 8, c: [90, 98, 120] });
      txt(`${e.nombre}\nCIF: ${e.cif}\n${e.direccion || ''}`, M, 42, { w: W / 2 - M - 4 });
      txt(`${nombreDe(u)}\nDNI/NIE: ${u.dni || '—'}\nCentro: ${centroById(u.centroId)?.nombre || '—'} · ${CONTRATOS[u.contrato] || ''}`, W / 2, 42, { w: W / 2 - M });
      const filas = res.filas.map(r => [diaCorto(r.dia), r.turnos.map(t => `${t.inicio}–${t.fin}`).join('\n'), r.j ? r.j.tramos.map(([a, b]) => `${hora(a)}–${hora(b)}`).join('\n') : '', r.j?.pausaMs ? dur(r.j.pausaMs) : '', r.j ? dur(r.trab) : '', r.extra ? dur(r.extra) : '', [r.aus ? AUSENCIAS[r.aus.tipo] : '', r.j?.corregido ? 'Corregido' : '', ...(r.j?.incid || [])].filter(Boolean).join('; ')]);
      doc.autoTable({
        startY: 58, margin: { left: M, right: M }, theme: 'grid',
        head: [['Fecha', 'Turno previsto', 'Entrada – salida', 'Pausas', 'Horas', 'Extra', 'Observaciones']],
        body: filas.length ? filas : [['', '', 'Sin registros este mes', '', '', '', '']],
        foot: [[{ content: `Totales (${res.dias} días trabajados) · previstas ${dur(res.prev)}`, colSpan: 4 }, dur(res.tot), dur(res.extra), '']],
        styles: { fontSize: 8, cellPadding: 1.6, lineColor: [205, 210, 225], lineWidth: 0.2, textColor: [25, 25, 35] },
        headStyles: { fillColor: AZ, textColor: 255, fontStyle: 'bold' }, footStyles: { fillColor: [238, 241, 255], textColor: [20, 20, 30], fontStyle: 'bold' },
        alternateRowStyles: { fillColor: [248, 249, 253] }, columnStyles: { 4: { halign: 'right' }, 5: { halign: 'right' }, 6: { cellWidth: 40 } },
      });
      let y = doc.lastAutoTable.finalY + 7;
      const nueva = h => { if (y + h > 285) { doc.addPage(); y = 20; } };
      if (cierre) {
        const t = `Cierre mensual: ${fechaHora(toDate(cierre.creadoTs))}. Horas extra: ${dur(cierre.extraMs)} (${{ pago: 'retribuidas', descanso: 'compensadas con descanso', ninguna: 'no aplica' }[cierre.compensacion] || '—'}). ${cierre.firmadoTs ? `Firmado electrónicamente por el trabajador el ${fechaHora(toDate(cierre.firmadoTs))}: ${cierre.firmaConforme ? 'CONFORME' : 'NO CONFORME'}${cierre.firmaComentario ? ' — ' + cierre.firmaComentario : ''}.` : 'Pendiente de firma del trabajador.'}\nHuella SHA-256: ${cierre.huella}`;
        const l = doc.splitTextToSize(t, W - 2 * M); nueva(l.length * 4 + 4); txt(l, M, y, { s: 8 }); y += l.length * 4 + 4;
      }
      nueva(32); y += 14; doc.setDrawColor(60); doc.setLineWidth(0.3);
      doc.line(M, y, M + 75, y); doc.line(W - M - 75, y, W - M, y);
      txt('Firma de la empresa', M, y + 4, { s: 8 }); txt('Firma del trabajador/a', W - M - 75, y + 4, { s: 8 }); y += 12;
      const legal = doc.splitTextToSize(`Registro diario de jornada conforme al art. 34.9 del Estatuto de los Trabajadores (Real Decreto-ley 8/2019). Las horas extraordinarias se totalizan mensualmente según el art. 35.5 ET. Las horas de los fichajes las fija el servidor en el momento del registro y no pueden alterarse; cualquier corrección consta con autor, fecha y motivo. Documento a conservar durante ${RETENCION_ANIOS} años (hasta ${hastaConserv(mes)}) a disposición de la persona trabajadora, sus representantes legales y la Inspección de Trabajo y Seguridad Social. Generado el ${fechaHora(new Date())}.`, W - 2 * M);
      nueva(legal.length * 3.2); txt(legal, M, y, { s: 7, c: [90, 98, 120] });
    });
    const n = doc.getNumberOfPages(); for (let i = 1; i <= n; i++) { doc.setPage(i); txt(`${e.nombre} · Página ${i} de ${n}`, W / 2, 292, { s: 7, c: [140, 146, 165], a: 'center' }); }
    const nombre = lista.length === 1 ? `registro_${nombreDe(lista[0].usuario).normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/\W+/g, '_')}_${lista[0].mes}.pdf` : `registro_jornada_${lista[0].mes}.pdf`;
    const blob = doc.output('blob'); const file = new File([blob], nombre, { type: 'application/pdf' });
    m.close();
    audit('informe_pdf', lista.map(x => `${nombreDe(x.usuario)} ${x.mes}`).join(', '));
    // En el móvil se abre el menú de compartir (guardar en Archivos, enviar por WhatsApp/email…); en el ordenador se descarga.
    const movil = matchMedia('(pointer:coarse)').matches;
    const m2 = modal(`<h2>PDF listo</h2><p class="sub">${esc(nombre)}</p><div class="acts">${movil && navigator.canShare?.({ files: [file] }) ? '<button class="btn" id="p-share">Compartir</button>' : ''}<button class="btn pri" id="p-open">Abrir / descargar</button></div>`);
    const sh = $('#p-share', m2); if (sh) sh.onclick = async () => { try { await navigator.share({ files: [file], title: nombre }); m2.close(); } catch (er) { if (er.name !== 'AbortError') toast(errMsg(er), 'err'); } };
    $('#p-open', m2).onclick = () => { const url = URL.createObjectURL(blob); const a = document.createElement('a'); a.href = url; a.download = nombre; if (movil) a.target = '_blank'; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 60000); m2.close(); };
  } catch (er) { m.close(); toast(errMsg(er), 'err'); }
}

/* ================= ADMIN: auditoría ================= */
RUTAS['admin/auditoria'] = async el => {
  const logs = await q('auditoria', F.orderBy('ts', 'desc'), F.limit(400));
  const render = f => { f = f.toLowerCase(); $('#au-l').innerHTML = logs.filter(l => !f || `${l.autorNombre} ${l.accion} ${l.detalle}`.toLowerCase().includes(f)).map(l => `<tr><td>${fechaHora(toDate(l.ts))}</td><td>${esc(l.autorNombre)}</td><td><span class="tag">${esc(l.accion)}</span></td><td style="white-space:normal;min-width:220px">${esc(l.detalle)}</td></tr>`).join('') || '<tr><td colspan="4" class="empty">Sin resultados</td></tr>'; };
  el.innerHTML = `<h1>Auditoría</h1><p class="sub">Registro inalterable de todas las acciones (últimas 400). Nadie puede editarlo ni borrarlo.</p>
    <input id="au-q" placeholder="Filtrar…" style="margin:10px 0"><div class="card tw"><table><thead><tr><th>Fecha</th><th>Usuario</th><th>Acción</th><th>Detalle</th></tr></thead><tbody id="au-l"></tbody></table></div>
    <button class="btn sm" id="au-csv">Exportar CSV</button>`;
  $('#au-q').oninput = e => render(e.target.value); render('');
  $('#au-csv').onclick = () => descargar(`auditoria_${diaHoy()}.csv`, csv([['Fecha', 'Usuario', 'Acción', 'Detalle'], ...logs.map(l => [fechaHora(toDate(l.ts)), l.autorNombre, l.accion, l.detalle])]));
};

/* ================= ADMIN: ajustes ================= */
RUTAS['admin/ajustes'] = async el => {
  const e = S.empresa;
  el.innerHTML = `<h1>Ajustes</h1><form id="f-aj">
    <div class="card"><h3>Empresa</h3><label>Razón social</label><input name="nombre" value="${esc(e.nombre)}" required>
    <div class="grid2"><div><label>CIF</label><input name="cif" value="${esc(e.cif)}" required></div><div><label>Email privacidad</label><input name="emailEmpresa" value="${esc(e.emailEmpresa)}"></div></div>
    <label>Domicilio</label><input name="direccion" value="${esc(e.direccion)}"></div>
    <div class="card"><h3>Fichaje</h3>
    <label>Geolocalización</label><select name="geoModo"><option value="off">Desactivada</option><option value="registrar">Registrar si está disponible (no bloquea)</option><option value="obligatoria">Obligatoria para fichar</option></select>
    <div class="grid2"><div><label>Radio por defecto (m)</label><input name="radioDefectoM" type="number" value="${e.radioDefectoM ?? 300}"></div><div><label>Jornada diaria por defecto (h)</label><input name="jornadaDiariaH" type="number" step="0.25" value="${e.jornadaDiariaH ?? 8}"></div></div>
    <p class="note">La jornada diaria se usa para calcular horas extra los días sin turno asignado. Si hay turno, se compara con el turno.</p></div>
    <button class="btn pri block">Guardar ajustes</button><div class="err-box" id="aj-err"></div></form>
    <div class="card" style="margin-top:14px"><h3>Conservación de datos</h3><p class="sub">Los registros se guardan ${RETENCION_ANIOS} años como exige el art. 34.9 ET. La app no permite borrarlos; pasados los ${RETENCION_ANIOS} años pueden eliminarse desde Firebase Console.</p></div>`;
  $('#f-aj').geoModo.value = e.geoModo || 'registrar';
  $('#f-aj').onsubmit = async ev => {
    ev.preventDefault(); const f = ev.target;
    const data = { nombre: f.nombre.value.trim(), cif: f.cif.value.trim().toUpperCase(), emailEmpresa: f.emailEmpresa.value.trim(), direccion: f.direccion.value.trim(), geoModo: f.geoModo.value, radioDefectoM: +f.radioDefectoM.value || 300, jornadaDiariaH: +f.jornadaDiariaH.value || 8 };
    try { await F.updateDoc(F.doc(db, 'config', 'empresa'), data); Object.assign(S.empresa, data); audit('ajustes', JSON.stringify(data)); toast('Ajustes guardados', 'ok'); }
    catch (er) { $('#aj-err').textContent = errMsg(er); }
  };
};
